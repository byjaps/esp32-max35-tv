# =============================================================================
# ESP32-S3 MAX35-TV-W (Spotpear) — Voice Assistant + HUD  [v0.3.0]
# Hermes voice panel (HA assist satellite) — pt-PT
#
# Hardware base verified against the OFFICIAL manufacturer/RealDeco file:
#   RealDeco/xiaozhi-esphome  devices/Under_Development/Modular/HW/spotpear-tv_hw.yaml
#
# v0.2.0 (12/09/2026) — first version to run on the physical board:
#   + BACKLIGHT GPIO42 (ledc, inverted) — without this the screen stays BLACK
#   + ST7796 transform (mirror_x/mirror_y/swap_xy) the same as the official one
#   + wake word: okay_nabu, only that one. Replies to "okay nabu" AND to "okay hermes"
#     (measured 17/09); hey_jarvis and hey_hermes were dropped for not responding.
#   + Restart button (remote reboot) and Sound test button (tests the speaker)
#   ~ GT911 touch: address still to be confirmed by the I2C scan at boot
#
# v0.11.0 (12/09/2026) — MEDIA PLAYER on the panel speaker:
#   + media_player platform speaker (WAV 16 kHz mono, a single pipeline)
#   + scripts mp_stop_wake / mp_idle_resume (release the I2S bus)
#   See the "MEDIA PLAYER" block further down for why WAV 16 kHz.
#
# v0.11.1 (12/09/2026) — FIX for the I2S bus deadlock:
#   The trigger was `on_play`, which only fires AFTER the pipeline plays — and with
#   the wake word engine holding the bus the pipeline never played, so the
#   engine never stopped: the board filled the log with "Parent bus is busy" and ended up
#   not responding (needed a power cycle). Now:
#   + global lock `mp_playing` + `on_turn_on` trigger (arrives BEFORE the pipeline)
#   + `on_idle` returns the player to OFF to re-arm on_turn_on
#   + wake word engine never starts while `mp_playing` (mww_resume + interval)
#   + push-to-talk for the media player before opening the conversation
#
# v0.12.0 (12/09/2026) — MEDIA SCREEN + SINGLE VOLUME:
#   + screen shows "A TOCAR" + title + volume bar while there is media
#     (`text` entity "Titulo do media" — HA writes what is playing there)
#   + 2 s watchdog: the wake word engine never runs with media armed, and
#     frees itself if the command is accepted but nothing ever starts playing
#   + single volume (`vol_pct`): the `number` and the `media_player` both write
#     to the same speaker and diverged (65% vs 82%); now they follow each other
#   + on_boot aligns the media player volume (it restored the last saved value
#     and rewrote the speaker one — that is where the clipping 100% came from)
#
# v0.12.1 (12/09/2026) — media screen only outside conversations:
#   The assistant TTS goes through this media player's `announcement_pipeline`
#   (`voice_assistant: TTS stream start` -> `State changed to ANNOUNCING`), so
#   `mp_playing` stayed true during the reply and the screen switched to "A TOCAR"
#   mid-speech. The media screen now requires `va_state == 0`.
#
# v0.12.2 (12/09/2026) — volume survives reboots:
#   The `number` "Volume da coluna" now uses `restore_value: true` and it is the one in charge
#   at boot (the `on_boot` aligns the speaker and the media player to its value).
#   Without this, every OTA/reboot reset it to 75 and wiped the author's choice.
#
# v0.13.0 (12/09/2026) — audible floor (at the author's request):
#   The 0-100 UI range now maps onto vol_min..vol_max (0.35..0.80 on the speaker)
#   instead of 0.0..0.75. Reason measured on the ES8311 (reg 0x32, dB = reg*0.5 - 95.5):
#   at 0.2625 — which was the "35" the author pointed at — that is -62 dB and nothing is heard;
#   the lower half of the slider was a desert. Now the minimum gives -51 dB (0.35) and the
#   maximum goes from 0 dB (0.75) up to +6.5 dB (0.80).
#
# v0.13.1 (12/09/2026) — ceiling back and end of the volume fight:
#   The 0.80 ceiling (+6.5 dB) distorted: rejected by the author, back to 0.75 (0 dB).
#   The 0.35 floor (-51 dB) STAYS — it is the point from which one can hear.
#   Volume is now EVENT-driven in both directions (`on_volume` mirrors it in the
#   `number`) instead of 2 s polling: the media player DISCARDS volume sets
#   when the queue is full (`xQueueSend(..., 0)`), so adopting its value
#   left the number stuck at an old value (seen: 90, then 100).
#
# v0.14.0 (12/09/2026) — SCREEN: "arc reactor" HUD (the ring the author chose):
#   + animated state ring (colour + speed per state), ported from the jarvis_ai
#     HUD canvas to the ESPHome display primitives (filled_ring/
#     filled_circle/filled_triangle) — NO alpha: what was `globalAlpha` is
#     blended with the background black before writing the pixel
#   + media screen: the ring now shows the VOLUME (green arc) + "A TOCAR",
#     title, station and bar
#   + footer with battery; clock at the top
#   + the rotation is adjustable IN REAL TIME via the `number` "Animação (fps)"
#     (display at `update_interval: never` + script `ecra_loop`): that is what
#     allows measuring the effect of the screen SPI on the audio without recompiling
#   + removed the "Speaker Enabled" switch (it fired speaker.mute_off at
#     boot and fought over the I2S bus — log noise, no function)
#   + Uptime sensor (to confirm unexpected reboots)
#   ⚠️ NO LVGL on purpose: a ring with quads + native primitives costs
#      less RAM than redrawing the whole screen in lv_arc widgets.
#
#   ℹ️ 2026-10-05: the 0.15.x series is built with the ESPHome from `.venv313` (Monday
#      cron + `pip install --upgrade`). 0.15.5 = 2026.9.0; 0.15.6 =
#      **2026.9.1**. Always confirm on both sides: `esphome version` on the
#      machine that compiles and the board's `versao do firmware` sensor (answers
#      "0.15.6 (ESPHome 2026.9.1)").
#      HISTORY (for whoever sees ~60 s reboots again): on 20/09 a build
#      2026.9.0 with the config OF THE TIME rebooted the board every ~60 s (uptime
#      3.4 s -> 63.5 s -> 2.5 s, with silent bootloader rollback) and for
#      that reason the 0.15.x series stayed pinned to 2026.8.2. The reboots stopped with the
#      va_state watchdog (v0.15.3); since then 0.15.4 and 0.15.5 show no
#      reboots (the only reset reason is `Reboot request from
#      esphome.ota`, that is, our own flashes).
# v0.15.12 (18/10/2026) — AUDIO LOST AT THE START OF THE TURN (the real cause of having
#   to repeat commands). Proof in the log with assist_pipeline debug: the same
#   session transcribed "Que horas sao?" and "Liga a luz pequena." correctly, but
#   "agora desliga" reached the STT as "Porta de liga." — the START of the audio dropped.
#   The `Cannot receive audio, buffer is full` of every turn was the pipeline
#   buffer overflowing. Source: each screen frame costs ~150 ms of the main
#   loop and at 4 fps that is ~60% of the time drawing (mipi_spi, 307 KB/frame).
#   Fix: `hud_set` sets the animation to 0 while there is a conversation (the screen keeps
#   updating 1x/s through `ecra_loop`) and restores the user's pace at the end.
# v0.15.11 (18/10/2026) — conversation mode worked, but the ceiling of 3 cut the
#   conversation at the 4th command ("after a few commands it asks for ok nabu again").
#   The ceiling is a brake in case the TV fires turns on its own, not a usage
#   limit: 5 -> 50 (`Respostas seguidas`), default 10. Since the `number` has
#   `restore_value`, the old value (3) stays in flash — after the OTA you must
#   set 10 in HA (`number.set_value`), otherwise it keeps cutting at 3.
# v0.15.10 (18/10/2026) — FIX for the v0.15.9 conversation mode, which never opened the
#   window. Two causes, both visible only in the log with explicit `level: INFO`:
#   1) the condition required `id(va_state) == 0`, but in `on_tts_stream_end` the state
#      is still 3 (speaking) — hud_set only sets it to 0 at the end of `mww_resume`. The
#      window always fell into the `else`. Removed the `va_state` test.
#   2) `conv_janela` closed only if `conv_espera && va_state == 1`; the same
#      problem from the other side. Now `conv_espera` alone is enough (it falls in
#      `on_stt_vad_end` when there was speech, so it tells the two cases apart).
#   + `logger.log` in conversation mode with `level: INFO` (a `logger.log` without level is
#     DEBUG and the device is at INFO — that is why 0.15.9 looked dead).
#   + delay 700ms -> 1200ms before reopening: the amplifier is still
#     draining when the last byte leaves.
# v0.15.9 (18/10/2026) — CONVERSATION MODE (author's request: "fast replies and
#   actions, fluid conversation", after seeing a demo where orders are given back to back
#   without repeating the wake word):
#   + after the TTS ends, the board reopens the microphone BY ITSELF (no "okay nabu")
#     and HA handles the VAD; if nobody speaks within 7 s, it closes and hands the
#     wake word engine back to listening.
#   + chain limited by `conv_max` (number "Respostas seguidas", 0 = off,
#     default 3): without this ceiling the board would listen to the TV indefinitely and
#     every noise cost one agent turn (6-40 s).
#   + `conv_count` goes back to 0 on every new wake word (on_start without `conv_espera`).
#   + `conversation_timeout` 5 s -> 8 s: the follow-up counts as the SAME conversation
#     (the HA context is kept). ⚠️ This field is NOT the listening window — it only
#     resets the conversation_id; the window is `conv_janela` (7 s).
#   DO NOT TOUCH `mww_resume`: it is still what returns the engine to listening
#   when conversation mode does not apply (see the v0.15.7/0.15.8 lesson).
# v0.15.8 (14/10/2026) — v0.15.7 REVERTED (it was a mistake of mine):
#   The new guard (`!id(box_speaker).is_running()` in mww_resume) left the wake word
#   engine stopped for ~30-60 s after every reply — measured by the author: "only
#   after about 1 minute does it hear the ok nabu again".
#   PROOF IN THE ESPHOME SOURCE (components/voice_assistant/voice_assistant.cpp,
#   State::RESPONSE_FINISHED): the `on_tts_stream_end` trigger ONLY fires after
#   `speaker_buffer_size_ == 0`, `!has_buffered_data()` AND `!is_running()` — that
#   is, once ALL the audio has already left. Contrary to what I assumed, the trigger
#   is not "HA has just finished sending". The original `delay: 1s` (15 x 400 ms) was already
#   correct and `is_running()` stays true longer than the playback, so the
#   guard could only block.
#   DO NOT REPEAT: do not condition the engine start on the speaker
#   state again. If the speech gets cut again, measure the AUDIO FIRST (the HA cache in
#   /config/tts/ and the file path to the speaker) — the cut does not come from here.
# v0.15.7 (14/10/2026) — END OF SPEECH CUT IN HALF (REVERTED in v0.15.8):
#   The wake word engine returned to listening 1 s after HA FINISHED SENDING the
#   audio (on_tts_stream_end), without looking at the speaker. Result measured on the
#   panel: the reply "Desligado" began and was cut half-way. The same audio,
#   played by the media_player (where `mp_playing` already protected it), gave 18.6 s of the
#   18.9 s of the file — so the problem was the engine grabbing the I2S bus
#   during playback. mww_resume now also requires
#   `!id(box_speaker).is_running()` (the ESPHome `speaker` exposes that state) and
#   waits up to 30 s instead of 6 s; if it runs out, it starts the engine anyway (it never stays
#   deaf to "Okay Nabu").
# v0.15.6 (05/10/2026) — ESPHome upgrade ONLY: 2026.9.0 -> 2026.9.1.
#   Config unchanged: the author decided to KEEP both wake word models as
#   they are. Reason (measured on the "Ultima wake word" sensor, 27/09-05/10): the false
#   triggers with the TV are SPLIT — ~15 from `okay_nabu` (0.93) against ~13 from
#   `ok hermes` (0.90); the 3 he heard today ("Não percebi") were from
#   okay_nabu. Removing ok hermes would only solve half and nothing is lost (the
#   okay_nabu already catches "ok hermes", measured 17/09) — it stays as an option if it returns.
# v0.15.5 (26/09/2026) — CLEANER SCREEN (author's request):
#   + "em espera" became WHITE (it was the same cyan as "a falar" — on the panel
#     they were not told apart; the cyan is now only for "a falar");
#   + gone from the screen: weekday, top clock, date and footer battery
#     (the sensors are still in HA — they just stopped being drawn);
#   + the TIME moved to the centre of the ring (font_med 40 px, white), in place
#     of the "EM ESPERA" text.
# v0.15.4 (26/09/2026) — FIX FOR THE FALSE TRIGGERS (the TV was waking the panel):
#   cutoff of the custom model `ok hermes` 0.50 -> 0.90. Measured before touching it:
#   at 0.50 the panel woke ~20x in one afternoon (13:38-19:32) with TV speech and
#   replied "Nao percebi"; the okay_nabu (0.93) did not fire a single time.
# v0.15.2/0.15.3 (25/09/2026) — two wake word models (four phrases), the Wake
#   Word Library as the source of new models and the voice latency work.
#   (Both went up in the SAME repo commit — 465ede0 — and only 0.15.3 kept
#   the number; the text of this entry comes from the commit itself, not invented.)
# v0.15.1 (20/09/2026) — "Motivo do ultimo reset" sensor (diagnosis of the reboots).
# v0.15.0 (20/09/2026) — BUTTON GESTURES (author's request):
#   + short click = volume +10% | double click = volume -10%
#     (old: any touch opened the conversation straight away)
#   + press >=600 ms = voice assistant (push-to-talk, as before)
#   + volume notice on the HUD for 1.5 s after the click (without this the gesture
#     gave no feedback at all when there is no media playing)
#   ⚠️ The box's POWER button is NOT part of this: it is not wired to any GPIO —
#      it lives in the power latch circuit (U1 + Q1/Q2 + Power_EN). There is no
#      possible firmware gesture on that button. See the button block.
# =============================================================================

substitutions:
  name: esp32-max35-tv
  friendly_name: "Mini TV Assistente"
  rotate_display: "0"
  # --- VOLUME CEILING --------------------------------------------------------
  # The ES8311 saturates above ~0 dB. The driver wants 0xBF (= 0.75 on the
  # speaker range, the old "75%"); beyond that the speech becomes unrecognisable and the
  # music distorts. The limit now sits on the INTERFACE scale: 100% on the
  # controls (HA/number/screen) = 0.75 on the speaker. Nothing in the UI goes past this.
  # Volume scale: 0-100 on the UI -> vol_min..vol_max on the speaker (raw, 0.0-1.0).
  # On the ES8311 register 0x32 is -95.5 dB (0x00) .. 0 dB (0xBF=191) .. +32 dB (0xFF),
  # linear: dB = reg*0.5 - 95.5. Hence:
  #   vol_min 0.35 -> reg 89  -> -51 dB (the lowest that can still be heard; below
  #                 this it is a dead zone — it was the old "35", at -62 dB)
  #   vol_max 0.75 -> reg 191 -> 0 dB (the maximum BEFORE distorting). 0.80 (+6.5 dB)
  #                 already distorted — tested and rejected by the author on 12/09.
  vol_min: "0.35"
  vol_max: "0.75"
  vol_default: "75"   # initial volume, as % of the UI scale
  fw_version: "0.15.27"   # firmware version (project.version + sensor in HA)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.8.0
  project:
    name: hermes.max35-tv
    version: "${fw_version}"
  # The `speaker` component starts at volume 1.0, and that writes 0xFF to the
  # ES8311 volume register = MAXIMUM GAIN. The ES8311 driver wants 0xBF
  # (0 dB) — the value 0xFF sits far above it and the signal SATURATES. Exact symptom:
  # the music/melody is still recognisable (a saturated tone still sounds like a
  # tone), but the SPEECH becomes unrecognisable, with noise on top.
  # on_boot at -100 runs AFTER the speaker setup (PROCESSOR = 0), so
  # this correction prevails over the 1.0.
  on_boot:
    priority: -100
    then:
      # SCREEN: starts the display update engine (see script ecra_loop).
      # Priority -100 runs after all setup() (the display is already
      # initialised), so the screen is alive from boot.
      - script.execute: {id: ecra_loop}
      # VOLUME: the `number` is in charge (saved across reboots). The media player
      # restores ITS OWN preferences, which may be different — that is where a
      # 100% that saturated the ES8311 came from. Align both to the number value.
      # The 5% floor avoids waking the speaker muted if the preference comes back corrupt.
      - lambda: "id(vol_pct) = (id(vol_speaker).state >= 5.0f) ? id(vol_speaker).state : ${vol_default};"
      # speaker.volume_set raw: here the value is the speaker's vol_min..vol_max, NOT the
      # UI scale — hence the linear remap min + pct*(max-min).
      - speaker.volume_set:
          id: box_speaker
          volume: !lambda "return ${vol_min} + (id(vol_pct) / 100.0f) * (${vol_max} - ${vol_min});"
      # (The media player scale is the UI one; volume_max remaps it.)
      - media_player.volume_set:
          id: painel_mp
          volume: !lambda "return id(vol_pct) / 100.0f;"
      # START of the wake word engine. start() gives up if the component
      # is not yet in the loop phase (is_ready()), and on_boot runs
      # during setup - so the delay is MANDATORY. The interval further
      # down tries again, as a safety net.
      - delay: 10s
      - micro_wake_word.start:
          id: mww

esp32:
  variant: ESP32S3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  # INFO (it was at DEBUG, temporarily, to catch the I2C scan and the wake word
  # start-up — that phase is closed). Less noise and less CPU formatting
  # lines nobody reads.
  level: INFO
  logs:
    # ⚠️ The screen redraws at ~4 fps and EACH frame costs ~150 ms measured in the log
    # ("ecra_loop took a long time for an operation (150 ms), max is 50 ms").
    # The cost is STRUCTURAL, not a fault: mipi_spi pushes the WHOLE buffer
    # (480x320x16 bits = 307 KB; SPI alone at 40 MHz is ~61 ms) and has no
    # partial update. Only this tag is silenced (warnings) — the [E] still
    # show up — so the log does not fill with a warning repeated every frame.
    component: ERROR

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # ⚠️ NO `encryption:` on purpose: the build in use is 2026.9.0 (which already
    # supports encrypted OTA) BUT the board still offers plain-text OTA, and the
    # CLI is fail-closed. See the home-assistant skill ref
    # esphome-api-encryption.md for the correct order before adding
    # `encryption:` here.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE   # no delay in the voice reply

# --- SERVICE BUTTONS ---------------------------------------------------------
button:
  - platform: restart
    name: "Reiniciar"
  - platform: template
    name: "Teste de som"
    icon: "mdi:music-note"
    on_press:
      - rtttl.play: "escala:d=8,o=5,b=180:c,d,e,f,g,a,b,c6"

# --- BUTTON: GESTURES (short click / double click / long press) --------------
# ⚠️ There are TWO buttons on the box (BOOT and POWER) but only BOOT reaches the ESP32.
# The POWER button is in the board's power latch circuit (IC U1 +
# Q1/Q2 APM2307 + net Power_EN, in schematic ESP32S3-3.5inch-AI-1.pdf): no
# GPIO touches it, so the firmware does NOT see it and cannot give it gestures — on/off
# is done by the latch electronics, whatever the touch duration.
# Gestures implemented on this single read button (GPIO0):
#   short click (<=400 ms) ..... volume +10%
#   double click (2x <=400 ms) .. volume -10%
#   press >=600 ms ............. voice assistant (push-to-talk)
# The 400/600 ms leave a 200 ms dead zone ON PURPOSE: it guarantees that
# no sequence of touches fires two gestures at the same time (with the click
# threshold equal to the press one, a touch at the limit fired both).
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    id: boot_button
    name: "Botão"
    on_multi_click:
      # --- short click: volume +10% ---
      - timing:
          - ON for at most 400ms
          - OFF for at least 350ms
        then:
          - logger.log:
              # level INFO: the logger is at INFO; without this (DEBUG) the gesture
              # left no trace at all in the board log.
              format: "Botao: clique -> volume +10%"
              level: INFO
          - script.execute: {id: vol_step, delta: 10.0}
      # --- double click: volume -10% ---
      - timing:
          - ON for at most 400ms
          - OFF for at most 300ms
          - ON for at most 400ms
          - OFF for at least 350ms
        then:
          - logger.log:
              # level INFO: the logger is at INFO; without this (DEBUG) the gesture
              # left no trace at all in the board log.
              format: "Botao: clique duplo -> volume -10%"
              level: INFO
          - script.execute: {id: vol_step, delta: -10.0}
      # --- long press: push-to-talk ---
      # RELIABLE way to talk to Hermes: the English wake words fail
      # with a pt-PT accent (verified). Pressing (>=600 ms) = listening; releasing
      # ends and sends.
      - timing:
          - ON for at least 600ms
        then:
          - logger.log:
              # level INFO: the logger is at INFO; without this (DEBUG) the gesture
              # left no trace at all in the board log.
              format: "PUSH-TO-TALK: a ouvir..."
              level: INFO
          # If there is media playing, stop it first: the speaker and the microphone
          # share the I2S bus and without this the conversation never started.
          - if:
              condition:
                lambda: "return id(mp_playing);"
              then:
                - media_player.stop: painel_mp
          - voice_assistant.start:
    # Do NOT send voice_assistant.stop on RELEASE. HA closes the audio by itself
    # when its VAD detects the end of speech (event 12) and the board stops the
    # microphone at that instant. Sending stop on release cut the transcription
    # half-way — whisper medium takes ~3 s — and that was what forced you to
    # keep the finger on the button (verified in the log on 12/09).

  # --- CHARGER PLUGGED IN (GPIO7) --------------------------------------------
  # The board's red LED is no use for this: it is tied to the CHG pin of the
  # charger (MP2636), not to a GPIO — it lights only while current flows and
  # goes out within seconds when the battery is full. What tells whether the charger
  # is plugged in is GPIO7: the schematic (ESP32S3-3.5inch-AI-1.pdf) shows the
  # USB voltage divided by R59 (20K) / R61 (30K) and tied to that pin
  # (5 V -> 3.0 V on the pin, which the ADC reads; 0 V with the cable out).
  - platform: template
    name: "Carregador ligado"
    id: carregador_ligado
    device_class: plug
    icon: "mdi:power-plug"
    # No update_interval: the template binary_sensor does not accept that field —
    # ESPHome re-evaluates the lambda by itself whenever `usb_voltage` changes.
    lambda: |-
      float v = id(usb_voltage).state;
      if (isnan(v)) return {};
      return v > 3.5f;   // USB presente (~5 V) vs cabo fora (~0 V)

# --- STATE (HUD) -------------------------------------------------------------
# 0=idle 1=listening 2=thinking 3=speaking 4=error
globals:
  - id: va_state
    type: int
    restore_value: no
    initial_value: "0"
  # 29/10/2026 — seconds left until the next timer, computed in the
  # 1 s `interval` (not in the screen lambda) so that drawing stays cheap and
  # there is a diagnostic sensor that can be read from a distance.
  - id: contagem_rest
    type: int
    restore_value: no
    initial_value: "-1"
  # 29/10/2026 — alarm pre-warning: the author saw the white clock for a few
  # seconds after the 0, because the sequence «timer.finished -> HA -> switch ->
  # drawing» takes 1-3 s. We mark the instant when <=2 s were left and the screen
  # starts drawing the alarm clock until 8 s after that (or until the switch turns on).
  # 29/10: the pre-warning started at 2 s and the author thought it early — it stayed at 1 s.
  - id: alarme_pre_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ecra_alarme
    type: bool
    restore_value: no
    initial_value: "false"
  # Instant (millis) of the last CHANGE of va_state. It is what the state
  # watchdog uses to know how long the board has been stuck in a voice state
  # (see the 2 s interval). Without this only the symptom was visible: screen on "a ouvir" or
  # "a falar" forever and the wake word engine stopped, because the engine guard
  # requires va_state == 0 — seen on 25/09, 3 min 15 s stuck until it was unplugged
  # from the mains (the HA side had already finished; the pipeline closed without firing
  # on_tts_stream_end or on_end).
  - id: va_estado_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # v0.15.15 — instant when HA asked to SPEAK (TTS). Goes back to 0 when the
  # audio has ended. It serves to catch the state stuck at "a falar" where the speaker
  # never gets to start (I2S bus held by the wake word engine):
  #   [E][i2s_audio.speaker:115]: Driver failed to start; retrying in 1 second
  #   [E][i2s_audio.speaker.std]: Parent bus is busy
  # Seen on 18/10: the screen stayed on "a falar" forever and `va_state` too,
  # because the normal watchdog counts from the last state CHANGE.
  - id: tts_pend_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # ⚠️ Not decorative: it is the lock that stops the wake word engine from grabbing the
  # I2S bus while there is media. With the engine running, the speaker spews
  #   [E][i2s_audio.speaker.std]: Parent bus is busy
  # in a loop, and the board SHUTS DOWN (it stopped answering WiFi and had to be
  # unplugged on 12/09). See the media player section.
  - id: mp_playing
    type: bool
    restore_value: no
    initial_value: "false"
  # Instant when the media player became "armed" (command accepted). It serves to
  # release the case where nothing ends up playing (dead URL, or someone touching
  # the HA card) — without this the wake word engine stayed stopped forever.
  - id: mp_armado_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # Single speaker volume, in %. The `number` (HA) and the `media_player` (HA
  # card) BOTH write to the same speaker — without a single value they diverge (the author
  # caught them at 65% and 82% at the same time) and the louder one saturates the ES8311.
  - id: vol_pct
    type: float
    restore_value: no
    initial_value: "75.0"
  # Accumulated angle of the ring animation, in degrees. It advances by TIME (degrees per
  # second, depending on the state) and not per frame: that way changing the `number`
  # "Animação (fps)" changes the smoothness, not the animation speed.
  - id: rot_deg
    type: float
    restore_value: no
    initial_value: "0"
  # Instant (millis) until which the HUD shows the VOLUME instead of the voice state.
  # It is the visual feedback of the button clicks (see script vol_step): without this, a
  # click to change the volume gave NO signal at all when there is no media playing.
  - id: vol_aviso_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # --- CONVERSATION MODE (v0.15.9) --------------------------------------------
  # How many follow-ups in a row have already been opened without a wake word. Goes back to 0 on
  # every new wake word; the ceiling comes from the `number` "Respostas seguidas" (conv_max).
  - id: conv_count
    type: int
    restore_value: no
    initial_value: "0"
  # true while the follow-up window is OPEN and nobody has spoken yet.
  # It lets on_start tell "woke up with the wake word" (resets the chain)
  # from "opened as a follow-up" (does not reset).
  - id: conv_espera
    type: bool
    restore_value: no
    initial_value: "false"
  # Screen rate chosen by the user, saved while the conversation is under way
  # (hud_set sets the animation to 0 and restores this value at the end). 0 = nothing saved.
  - id: fps_user
    type: float
    restore_value: no
    initial_value: "0"

script:
  # v0.15.17 — HUD Line timer. `mode: restart` makes every new value
  # restart the count; update("") does not re-arm the cycle (on_value
  # only runs with non-empty text).
  - id: hud_linha_limpa
    mode: restart
    then:
      - delay: 45s
      # this ESPHome action is `text.set` (not `text.set_value`).
      - text.set:
          id: hud_linha
          value: ""
  - id: hud_set
    parameters:
      state: int
    then:
      # v0.15.12 — THE SCREEN QUIETS DOWN DURING THE CONVERSATION.
      # Measured on 18/10: each frame costs ~150 ms of the main loop (mipi_spi,
      # 307 KB per frame) and at 4 fps that is ~60% of the time drawing. The symptom
      # was audio lost at the start of the turn ("Cannot receive audio, buffer is
      # full") and transcriptions with the beginning cut — "agora desliga" was heard
      # as "Porta de liga". With the animation at 0 during listening/thinking/speaking
      # the screen keeps updating 1x/s (see ecra_loop) and the mic has the whole CPU.
      # The rate chosen by the user is restored when it goes back to "em espera".
      - lambda: |-
          auto *num = id(anim_fps);
          if (state != 0) {
            if (num->state > 0.0f && id(fps_user) <= 0.0f) {
              id(fps_user) = num->state;
              num->make_call().set_value(0.0f).perform();
            }
          } else if (id(fps_user) > 0.0f) {
            num->make_call().set_value(id(fps_user)).perform();
            id(fps_user) = 0.0f;
          }
          // Fail-safe do anel «a trabalhar»: em espera nao ha ferramenta nenhuma a
          // correr. Se o plugin morrer a meio do turno, o violeta nao fica preso.
          if (state == 0 && id(trabalho).state) {
            id(trabalho).turn_off();
          }
          id(va_state) = state;
      - component.update: main_display

  # --- SCREEN: update engine (fps adjustable in real time) -------------------
  # The display is at `update_interval: never` — this is what drives the drawing. The
  # rate comes from the `number` "Animação (fps)": it can be stopped (0) or raised/lowered
  # without recompiling, which is what allows measuring the effect of the screen SPI on the audio
  # (the I2S bus is shared with the microphone and with the speaker).
  # With no screen on nothing is drawn (CPU saving when the backlight
  # is off — the rest of the state keeps being updated at 1 Hz).
  - id: ecra_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - if:
                condition:
                  light.is_on: screen_light
                then:
                  - component.update: main_display
            - delay: !lambda |-
                float f = id(anim_fps).state;
                if (f < 0.5f) return (uint32_t) 1000;
                if (f > 15.0f) f = 15.0f;
                return (uint32_t) (1000.0f / f);

  # Returns the wake word engine to listening AS SOON AS IT CAN.
  # The speaker holds the I2S bus while it has audio in the buffer and only releases it
  # when the amplifier switches off — a click is heard. Trying to start the
  # engine before that fails, so it is retried in a short loop instead of waiting
  # for a fixed time (which was a guess: sometimes it listened, sometimes not).
  # The screen only switches to "em espera" when the engine is REALLY listening — before
  # it said "em espera" a few seconds before it was.
  - id: mww_resume
    mode: restart
    then:
      - delay: 1s
      # ⚠️ WHY THIS IS NEEDED: ESPHome enables by default ONLY THE FIRST model
      # in the list (`default_enabled = i == 0` in micro_wake_word/__init__.py) and
      # then saves the state to flash (NVS, key = hash of the id). ok_hermes,
      # being the 2nd model, was born OFF — measured in the panel log:
      #   [I][mwwdiag]: motor=A CORRER | okay_nabu=on | ok_hermes=OFF
      # Do not depend on the list order or on what was left in flash: it is enabled here,
      # every time the engine goes back to listening (boot included).
      - micro_wake_word.enable_model: {id: ww_ok_hermes}
      - micro_wake_word.enable_model: {id: ww_okay_nabu}
      - repeat:
          count: 15
          then:
            - if:
                condition:
                  all:
                    - not:
                        micro_wake_word.is_running:
                    # NEVER with the media player playing: the engine grabbed the
                    # I2S bus and the speaker died (see globals/mp_playing).
                    - lambda: "return !id(mp_playing);"
                then:
                  - micro_wake_word.start:
                      id: mww
                  - delay: 400ms
      - logger.log: "Motor de novo a escuta"
      - script.execute: {id: hud_set, state: 0}

  # --- CONVERSATION MODE: reopen the microphone without a wake word ----------
  # Called in `on_tts_stream_end` (the reply has already left the speaker ENTIRELY). If the
  # chain has not reached the ceiling yet, it opens the window and starts the pipeline without
  # a wake word; if not, it returns the engine to listening as before.
  # ⚠️ The `delay` is not decorative: the speaker releases the I2S bus when the
  # amplifier switches off and starting the pipeline before that gives "Parent bus is busy".
  - id: conv_followup
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            lambda: |-
              int teto = (int) id(conv_max).state;
              return !id(conv_espera) && !id(mp_playing) &&
                     id(conv_count) < teto;
          then:
            - lambda: |-
                id(conv_count) += 1;
                id(conv_espera) = true;
            - logger.log:
                format: "conv: janela aberta (%d/%d), sem wake word"
                args: ["id(conv_count)", "(int) id(conv_max).state"]
                level: INFO
            - script.execute: {id: conv_janela}
            - voice_assistant.start:
          else:
            - logger.log:
                format: "conv: sem continuacao (count=%d teto=%d esp=%d mp=%d)"
                args: ["id(conv_count)", "(int) id(conv_max).state",
                       "id(conv_espera)", "id(mp_playing)"]
                level: INFO
            - script.execute: {id: mww_resume}

  # Closes the window if nobody speaks within 7 s.
  # `conv_espera` falls in `on_stt_vad_end` (there was speech), so this test
  # alone already tells "nobody spoke" from "we are replying" — do not use
  # `va_state` here: when the window opens the state is still 0/1 and hud_set comes
  # later, which already left the window open forever on the 1st attempt.
  - id: conv_janela
    mode: restart
    then:
      - delay: 7s
      - if:
          condition:
            lambda: "return id(conv_espera);"
          then:
            - logger.log:
                format: "conv: ninguem falou em 7s -> fechar janela"
                level: INFO
            - lambda: "id(conv_espera) = false;"
            - voice_assistant.stop:
            - script.execute: {id: mww_resume}

  # --- MEDIA PLAYER: release the I2S bus -------------------------------------
  # The microphone and the speaker share the SAME I2S bus on this board (a single
  # peripheral, a single mutex in ESPHome) and the wake word engine grabs it while
  # it is listening. If the media player starts with the engine running, the speaker
  # fails:
  #   [E][i2s_audio.speaker.std]: Parent bus is busy
  #   [E][i2s_audio.speaker:115]: Driver failed to start; retrying in 1 second
  # ⚠️ This is NOT solved with the `on_play` trigger: that only fires when the
  # pipeline REALLY starts playing (speaker_media_player.cpp: state=PLAYING), which
  # which never happens while the bus is stuck -> permanent deadlock. That is
  # why the locking is done in `on_turn_on` (it fires when the COMMAND arrives,
  # before the pipeline plays) and the state goes back to OFF in `on_idle` so the
  # next command fires again. It was this deadlock that on 12/09 left the
  # board repeating bus errors until it stopped responding (it had to be unplugged
  # from the mains).
  - id: mp_stop_wake
    then:
      - lambda: "id(mp_playing) = true; id(mp_armado_ms) = millis();"
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - micro_wake_word.stop:
                id: mww
            - logger.log: "Media: motor de wake word parado (bus I2S livre)"

  # End of media: release the lock and return the engine to listening. Unlike the
  # voice_assistant there is no "audio finished" event — on_idle arrives when the
  # pipeline stops. Never during a voice conversation (va_state == 0 = idle).
  # ⚠️ The condition must be the `mp_playing` global, NOT `media_player.is_idle`:
  # `on_idle` immediately puts the player to OFF (to re-arm on_turn_on) and
  # `is_idle` would then be false forever, leaving the engine dead.
  - id: mp_idle_resume
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            all:
              - lambda: "return !id(mp_playing);"
              - lambda: "return id(va_state) == 0;"
          then:
            - script.execute: {id: mww_resume}

  # --- VOLUME FROM THE BUTTON (10% clicks) -----------------------------------
  # Called by the BOOT button gestures (see the on_multi_click). It ALWAYS goes through the
  # `number` via make_call(), which runs its `set_action`: it is the only path
  # that writes to the speaker AND to the media player and keeps `vol_pct` consistent.
  # Writing straight to the speaker from here left the three at different values.
  - id: vol_step
    parameters:
      delta: float
    then:
      - lambda: |-
          float v = id(vol_pct) + delta;
          if (v > 100.0f) v = 100.0f;
          if (v < 0.0f) v = 0.0f;
          id(vol_aviso_ms) = millis() + 1500;
          auto call = id(vol_speaker).make_call();
          call.set_value(v);
          call.perform();
      - component.update: main_display

# --- SPEAKER VOLUME ----------------------------------------------------------
# The speaker starts at volume 1.0 = MAXIMUM gain on the ES8311 (saturates). This
# control lets the volume be tuned in real time from HA, without reflashing firmware.
number:
  - platform: template
    name: "Volume da coluna"
    id: vol_speaker
    icon: "mdi:volume-high"
    optimistic: true
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 75
    # Saves the value across reboots: it is the one that rules the speaker volume. Without
    # this, every update/reboot reset it to 75 and wiped the author's choice.
    restore_value: true
    set_action:
      - speaker.volume_set:
          id: box_speaker
          # 0-100 on the interface -> vol_min..vol_max on the speaker (audible floor + ceiling)
          volume: !lambda "return ${vol_min} + (x / 100.0f) * (${vol_max} - ${vol_min});"
      # A single volume: the same value (on the UI scale) goes to the media player,
      # which has another control on the HA card. Without this the two diverged and
      # whichever was louder rewrote the speaker one.
      - lambda: "id(vol_pct) = x;"
      - if:
          condition:
            lambda: "return fabsf(x / 100.0f - id(painel_mp).volume) > 0.02f;"
          then:
            - media_player.volume_set:
                id: painel_mp
                volume: !lambda "return x / 100.0f;"

  # Screen animation rate (see script ecra_loop). 0 = ring stopped, but the
  # screen keeps updating 1x/s (clock and state changes).
  # ⚠️ Each frame costs ~150 ms (mipi_spi pushes the whole buffer, 307 KB). At
  # 4 fps that is ~60% of the main loop time just drawing — changing this
  # entity is how you balance smoothness/CPU without recompiling. Going above
  # 6-7 is only worth it if the voice is confirmed not to lose quality.
  - platform: template
    name: "Animação (fps)"
    id: anim_fps
    icon: "mdi:speedometer"
    entity_category: config
    optimistic: true
    unit_of_measurement: "fps"
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 4
    restore_value: true

# Conversation mode (v0.15.9): how many follow-ups in a row without a wake word.
  # 0 = off (old behaviour: every order requires the wake word).
  - platform: template
    name: "Respostas seguidas"
    id: conv_max
    icon: "mdi:account-voice"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 10
    restore_value: true

# --- MEDIA TITLE (what is playing) -------------------------------------------
# The ESPHome media player does NOT receive metadata from HA (neither title nor station)
# — the API only carries the URL. This `text` is the bridge: HA writes here (text.set,
# entity "Titulo do media") and the media screen shows it. If nobody writes,
# the screen shows "Radio / Musica".
text:
  - platform: template
    name: "Titulo do media"
    id: mp_titulo
    icon: "mdi:music-note"
    optimistic: true
    mode: text
    min_length: 0
    max_length: 60
    initial_value: ""

# --- HUD LINE (written by the agent via the [HW:/display/info:...] marker) ---
# The `hermes` component in HA extracts the marker from the reply, calls
# text.set_value on this entity and the text is NEVER spoken. Empty = not drawn.
  - platform: template
    name: "Linha HUD"
    id: hud_linha
    icon: "mdi:message-text"
    optimistic: true
    mode: text
    min_length: 0
    max_length: 60
    initial_value: ""
    # v0.15.17 — the line does not stay on the screen waiting for someone to clear it:
    # 45 s after being written it disappears by itself, and a new wake word clears it
    # at once (see voice_assistant.on_start). Every new value restarts the count.
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - script.execute: hud_linha_limpa

# --- TIMER COUNTDOWN (29/10/2026) --------------------------------------------
# HA writes here the **UTC epoch** (seconds) of the end of the next timer;
# the screen works out what is left on every frame and draws it under the clock, in
# red. Empty = no timer. It is epoch and not «X minutes» on purpose:
# that way the countdown drops by the second on screen without HA writing every second.
  - platform: template
    name: "Contagem do temporizador (fim)"
    id: contagem_fim
    icon: "mdi:timer-outline"
    optimistic: true
    mode: text
    min_length: 0
    max_length: 12
    initial_value: ""

# --- WAKE WORD DIAGNOSTICS (temporary) ----------------------------------------
# Shows every 60s whether the engine is listening and whether the models are active.
# "modelos OFF" = HA sent an empty list in on_set_configuration and
# disabled them all.
# --- «A TRABALHAR» (WORKING) STATE (24/10/2026) -----------------------------
# Turned on by the Hermes `painel-trabalho` plugin while a tool runs on a
# request that came from the panel. It draws nothing by itself: it only changes the ring colour
# while `va_state == 2` (thinking). The plugin turns it off at the end of the turn and
# `hud_set` turns it off whenever the panel goes back to "em espera" (fail-safe).
switch:
  - platform: template
    name: "A Trabalhar"
    id: trabalho
    icon: "mdi:hammer-wrench"
    optimistic: true
    restore_mode: ALWAYS_OFF
  # 29/10/2026 — timer alarm ringing: the screen swaps the normal ring for
  # an animated alarm clock. Turned on/off by the HA `temporizador_alarme` script;
  # ALWAYS_OFF at boot so it never stays stuck on.
  - platform: template
    name: "Alarme a tocar"
    id: alarme_tocar
    icon: "mdi:alarm"
    optimistic: true
    restore_mode: ALWAYS_OFF

interval:
  # --- TIMER COUNTDOWN (1 s) ------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          std::string s = id(contagem_fim).state;
          int r = -1;
          if (!s.empty() && t.is_valid()) {
            long rest = atol(s.c_str()) - (long) t.timestamp;
            if (rest >= 0 && rest < 43200) r = (int) rest;   // ate 12 h
          }
          id(contagem_rest) = r;

          // Pre-aviso do despertador (ver comentario nos globals).
          if (r >= 0 && r <= 1) id(alarme_pre_ms) = millis() ? millis() : 1;   // 1 s (o autor achou 2 s cedo)
          bool pre = id(alarme_pre_ms) != 0 && (millis() - id(alarme_pre_ms) < 8000);
          if (id(alarme_tocar).state) id(alarme_pre_ms) = 0;   // ja toca: manda o switch
          id(ecra_alarme) = id(alarme_tocar).state || pre;
          // O diagnostico so publica enquanto ha temporizador (e uma vez ao
          // voltar a «sem temporizador»): 1 estado/s 24 h por dia era lixo no
          // recorder do HA — 86 mil linhas por dia por nada.
          static bool dbg_ativo = false;
          char b[96];
          if (r >= 0 || id(ecra_alarme) || id(alarme_tocar).state) {
            snprintf(b, sizeof(b), "rest=%d est=%d mp=%d al=%d ecra=%d fim=%s", r, id(va_state),
                     (int) id(mp_playing), (int) id(alarme_tocar).state, (int) id(ecra_alarme), s.c_str());
            id(dbg_contagem).publish_state(b);
            dbg_ativo = true;
          } else if (dbg_ativo) {
            id(dbg_contagem).publish_state("sem temporizador");
            dbg_ativo = false;
          }

  # --- MEDIA WATCHDOG (2 s) -------------------------------------------------
  # Reads globals only (cheap) and covers the paths that the media player trigger
  # does NOT catch.
  - interval: 2s
    then:
      # (1) The wake word engine must never be running with media armed:
      #     it grabs the I2S bus and the speaker keeps repeating "bus is busy".
      - if:
          condition:
            all:
              - micro_wake_word.is_running:
              # v0.15.15: also with the voice in progress (thinking 2 / speaking 3).
              # The pipeline `on_start` already stops the engine, but a delayed
              # `mww_resume` (from the previous turn) set it running again mid-way and the
              # speaker kept repeating "Parent bus is busy" forever.
              - any:
                  - lambda: "return id(mp_playing);"
                  - lambda: "return id(va_state) == 2 || id(va_state) == 3;"
          then:
            - micro_wake_word.stop:
                id: mww
      # (1b) v0.15.15 — "SPEAKING" WITH NO SOUND: HA asked for TTS but the speaker never
      #      started (I2S grabbed). Without this the screen and va_state stay at 3
      #      forever and the normal watchdog never fires (it counts from the
      #      last state CHANGE).
      - if:
          condition:
            all:
              - lambda: "return id(tts_pend_ms) != 0 && (millis() - id(tts_pend_ms) > 15000);"
              - not:
                  lambda: "return id(box_speaker).is_running();"
              - lambda: "return !id(mp_playing);"
          then:
            - logger.log: "TTS pedido ha >15s sem a coluna arrancar -> a destravar"
            - lambda: "id(tts_pend_ms) = 0;"
            - micro_wake_word.stop:
                id: mww
            - script.execute: {id: hud_set, state: 0}
            - script.execute: {id: mww_resume}
      # (2) Release: armed for more than 10 s with nothing playing or announcing
      #     (command accepted but the pipeline never started: dead URL, or someone
      #     messing with the HA card). Without this the wake word never came back.
      - if:
          condition:
            all:
              - lambda: "return id(mp_playing) && (millis() - id(mp_armado_ms) > 10000);"
              - not:
                  media_player.is_playing: painel_mp
              - not:
                  media_player.is_announcing: painel_mp
          then:
            - logger.log: "Media: armado sem tocar ha >10s -> a destravar"
            - lambda: "id(mp_playing) = false;"
            - media_player.turn_off:
                id: painel_mp
            - script.execute: {id: mww_resume}
      # (3) Volume: the `number` is in charge (source of truth, saved across reboots).
      #     Here that value is only PUSHED to the media player, so the HA card
      #     does not show something else. The reverse direction (touching the card) is caught
      #     by `on_volume` — with no polling and no fight between the two.
      #     ⚠️ Do not go back to "adopting" the media player volume here: the component
      #     DISCARDS volume sets when the queue is full (`xQueueSend(..., 0)`,
      #     "volume sets aren't that important!"), so its value gets stuck at an
      #     old value and the number jumped back (seen: number stuck at 90/100).
      - if:
          condition:
            lambda: "return fabsf(id(vol_pct) / 100.0f - id(painel_mp).volume) >= 0.02f;"
          then:
            - media_player.volume_set:
                id: painel_mp
                volume: !lambda "return id(vol_pct) / 100.0f;"

  # (4) VOICE STATE WATCHDOG (25/09) — va_state can get STUCK.
      #     Measured on 25/09: after several wake word tests in a row, the screen
      #     stayed on "a ouvir" and never left again; the HA side had finished fine
      #     (satellite idle, media off) but the firmware did not receive
      #     on_tts_stream_end or on_end, so:
      #       - the screen stayed on "a ouvir"/"a falar" forever;
      #       - guard (3) NEVER returned the engine to listening, because it requires
      #         va_state == 0 -> panel DEAF until unplugged from the mains
      #         (3 min 15 s, until the author cut the power).
      #     Here the instant of every state change is stamped...
      - lambda: |-
          static int est_ant = -1;
          if (id(va_state) != est_ant) {
            est_ant = id(va_state);
            id(va_estado_ms) = millis();
          }
      #     ...and "em espera" is restored when a state holds for too long
      #     WITH nothing playing. Limits per state (never below the legitimate time
      #     of the phase: a Hermes reply can take tens of seconds):
      #       1 = a ouvir    -> 45 s   (the listening phase is short)
      #       2 = a pensar   -> 180 s  (the voice plugin waits up to 140 s)
      #       3 = a falar    -> 90 s   (with media playing, never fires)
      #       4 = erro       -> 15 s   (visual warning; the board has to come back)
      - if:
          condition:
            all:
              - lambda: "return id(va_state) != 0;"
              - lambda: |-
                  uint32_t limite = (id(va_state) == 1) ? 45000
                                  : (id(va_state) == 2) ? 180000
                                  : (id(va_state) == 4) ? 15000 : 90000;
                  return (millis() - id(va_estado_ms)) > limite;
              # With media PLAYING (or an announcement) none of this applies: it is a
              # legitimate phase and touching the engine now would grab the I2S bus.
              - not:
                  media_player.is_playing: painel_mp
              - not:
                  media_player.is_announcing: painel_mp
          then:
            - logger.log: "va_state preso -> a repor em espera e o motor a escuta"
            - lambda: |-
                ESP_LOGW("vaguarda", "estado %d preso ha %u ms -> 0",
                         id(va_state), (unsigned) (millis() - id(va_estado_ms)));
                id(va_state) = 0;
            - script.execute: {id: hud_set, state: 0}
            - script.execute: {id: mww_resume}

  - interval: 60s
    then:
      # If the media player is playing, the engine HAS to be stopped (the
      # I2S bus is a single one). It covers any path that set the engine
      # running again in the middle of media.
      - if:
          condition:
            lambda: "return id(mp_playing);"
          then:
            - logger.log: "mwwdiag: media a tocar -> motor parado"
            - micro_wake_word.stop:
                id: mww
      # Safety net for the reverse: if a media command died without ever
      # playing (invalid URL, source down), the lock would stay stuck at true and the
      # wake word would never come back. It releases here.
      # ⚠️ Do not use `media_player.is_idle`: on_idle immediately puts the player to OFF.
      - if:
          condition:
            all:
              - lambda: "return id(mp_playing);"
              - not:
                  media_player.is_playing: painel_mp
              - not:
                  media_player.is_announcing: painel_mp
          then:
            - logger.log: "mwwdiag: media morreu sem tocar -> a destravar"
            - lambda: "id(mp_playing) = false;"
            - script.execute: {id: mww_resume}
      # Safety net: if the engine stays stopped (failed start, or an unexpected
      # stop), put it back to listening. Without a
      # voice_assistant.is_running guard (it stays true ~1.5 min after the
      # conversation and would block this). The normal path is on_end; this only
      # fires if something goes wrong.
      - if:
          condition:
            all:
              - not:
                  micro_wake_word.is_running:
              # NEVER during a conversation: the engine grabs the I2S bus in the
              # middle of the reply and the speaker cannot start
              # (silence). va_state == 0 means "em espera".
              - lambda: "return id(va_state) == 0;"
              - lambda: "return !id(mp_playing);"
          then:
            - logger.log: "mwwdiag: motor parado -> a arrancar"
            - micro_wake_word.start:
                id: mww
      - lambda: |-
          ESP_LOGI("mwwdiag", "motor=%s | okay_nabu=%s | ok_hermes=%s | va_state=%d (%u ms)",
                   id(mww).is_running() ? "A CORRER" : "PARADO",
                   id(ww_okay_nabu).is_enabled() ? "on" : "OFF",
                   id(ww_ok_hermes).is_enabled() ? "on" : "OFF",
                   id(va_state), (unsigned) (millis() - id(va_estado_ms)));
      # Safety net: HA has the power to turn them ALL off
      # (`VoiceAssistant::on_set_configuration()` calls disable() on every model and
      # only re-enables the ids its list has — and here its list is
      # empty: the "Palavra de despertar" selects only show no_wake_word).
      # If any turns up off, it switches itself back on.
      - if:
          condition:
            or:
              - not:
                  micro_wake_word.model_is_enabled: {id: ww_ok_hermes}
              - not:
                  micro_wake_word.model_is_enabled: {id: ww_okay_nabu}
          then:
            - logger.log: "mwwdiag: modelo desligado por fora -> a religar"
            - micro_wake_word.enable_model: {id: ww_ok_hermes}
            - micro_wake_word.enable_model: {id: ww_okay_nabu}

# --- BATTERY -----------------------------------------------------------------
# This board reads the battery through the ADC on GPIO6 with a 1:1 divider (multiply 2.0),
# the same as the manufacturer's official config (spotpear-tv_hw.yaml).
sensor:
  - platform: adc
    pin: GPIO6
    id: battery_voltage
    name: "Bateria Tensão"
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    icon: "mdi:battery-medium"
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 1
      - throttle: 1min

  - platform: template
    id: battery_percentage
    name: "Bateria"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return NAN;
      // Celula Li-ion: 3.30 V = 0% ... 4.20 V = 100%
      float pct = (v - 3.30f) / (4.20f - 3.30f) * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

  # USB voltage (GPIO7) — see the comment on the binary_sensor "Carregador ligado"
  # (charger plugged in). It is the only way the firmware knows the charger is connected.
  - platform: adc
    pin: GPIO7
    id: usb_voltage
    name: "USB Tensão"
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    icon: "mdi:usb"
    filters:
      - multiply: 1.6667   # (20K + 30K) / 30K — the R59/R61 divider
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
      - throttle: 1min

  # Time since boot. It serves to CONFIRM unexpected reboots: on
  # 12/09 the board rebooted by itself at 20:44 with no crash record at the
  # next boot (suspected brownout when starting the speaker). Without this there was no
  # way to date the next one.
  - platform: uptime
    id: uptime_s
    name: "Uptime"
    type: seconds
    update_interval: 60s

# --- SEPARATORS --------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO46
    mosi_pin: GPIO48

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

# --- AUDIO (2 separate codecs) -----------------------------------------------
# Mics = ES7210 (ADC) · Speaker = ES8311 (DAC)
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO10
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    # It HAS to match the sample_rate of the es8311 codec (16000) and the
    # microphone/I2S bus. It was 48000 while the DAC was at 16000 ->
    # the DAC misread the clock and "strange noise" came out of the speaker.
    sample_rate: 16000
    channel: mono

rtttl:
  speaker: box_speaker
  gain: 0.5

# --- MEDIA PLAYER (panel speaker) ---------------------------------------------
# Gives HA a media_player entity to play audio on the panel speaker:
# announcements/TTS, music, radio. Without this, the speaker only exists inside the
# voice_assistant and there is no way to send it anything from outside.
#
# ⚠️ FORMAT: WAV / 16000 Hz / mono — exactly the rate at which the ES8311 codec and
# the whole voice path are tuned. Do NOT copy the 48 kHz FLAC from the manufacturer's
# official config: that setup has resamplers and the bus at 48 kHz,
# and here the speaker and the DAC run at 16000.
#
# ⚠️ Declaring the WRONG rate here does NOT break the voice (contrary to what was
# written in PROXIMOS-PASSOS.md). Verified in the HA 2026.9.2 code
# (components/esphome/assist_satellite.py, handle_pipeline_start): the format of the
# TTS requested from the pipeline only comes from the media player when the device does NOT declare
# the SPEAKER feature. This board has `voice_assistant: speaker: box_speaker` ->
# `get_feature_flags()` in voice_assistant.h sets FEATURE_SPEAKER and the TTS stays
# FIXED at wav/16000/1/2 bytes. The warning would only apply if we swapped
# the voice_assistant `speaker:` for `media_player:` (they are mutually exclusive,
# cv.Exclusive). Do not swap without need.
#
# A single pipeline (announcement_pipeline): without `media_pipeline` the component
# enters single_pipeline_() mode and reuses the announcement format also for
# the "default" purpose (speaker_media_player.cpp, get_traits) — that is, EVERYTHING
# HA sends (announcement or music) is transcoded to WAV 16 kHz mono.
# No mixer or resamplers needed: those are only required when there are
# TWO pipelines (announcement + media), which makes the component require different
# speakers.
media_player:
  - platform: speaker
    id: painel_mp
    name: "Painel de voz"
    icon: "mdi:speaker"
    announcement_pipeline:
      format: WAV
      sample_rate: 16000
      num_channels: 1
      speaker: box_speaker
    # Has to match the volume that on_boot sets on the speaker (75% = 0 dB on the
    # ES8311). This component's setup runs BEFORE on_boot (-100) and writes
    # its volume to the speaker; if it stayed at the default (50%) the value in HA would say
    # one thing and the speaker would be at another.
    volume_initial: ${vol_default}%
    # FLOOR: 0% is not silence — it is vol_min (the lowest that can be heard). Without this
    # the useful range sat all at the top and the bottom half was dead.
    volume_min: ${vol_min}
    # CEILING: 100% on the control = ${vol_max} on the speaker. With 100% here, the HA card
    # slider fetched the ES8311 maximum gain and distorted everything.
    volume_max: ${vol_max}
    # ⚠️ THE TRIGGER HAS TO BE `on_turn_on`, NOT `on_play`/`on_announcement`.
    # `on_play` only fires when the pipeline is already playing — and with the wake word
    # engine holding the I2S bus the pipeline NEVER gets to play, so
    # the trigger never fires and the board stays stuck repeating "Parent bus is
    # busy" until it locks up. `on_turn_on` fires the instant the COMMAND
    # arrives (speaker_media_player.cpp, watch_media_commands_: OFF -> ON and
    # publish_state before starting the pipeline), which is early enough for
    # the engine to release the bus. `on_idle` returns the state to OFF so the next
    # command fires again. `on_play`/`on_announcement` stay as a
    # reinforcement (idempotent: mp_stop_wake only stops the engine if it is running).
    on_turn_on:
      - logger.log: "Media: comando recebido -> a libertar o bus I2S"
      - script.execute: {id: mp_stop_wake}
    on_announcement:
      - script.execute: {id: mp_stop_wake}
    on_play:
      - script.execute: {id: mp_stop_wake}
    on_idle:
      - lambda: "id(mp_playing) = false;"
      - script.execute: {id: mp_idle_resume}
      # Goes back to OFF to re-arm on_turn_on. OFF in HA is normal on this
      # component: it does not prevent play_media/announcements (see media_player.h,
      # USE_SPEAKER_MEDIA_PLAYER_ON_OFF).
      - media_player.turn_off: painel_mp
    # Volume changed on the HA CARD (or by volume_up/down): the media player has already
    # written the value to the speaker; here it is only mirrored in the `number`, so both
    # controls and the screen bar say the same. It is event-driven (not by
    # polling) on purpose: it was the polling that created the fight where the number
    # jumped back because the media player DISCARDS sets with a full queue.
    on_volume:
      - lambda: |-
          ESP_LOGD("mpvol", "media player: volume=%.3f (number dizia %.0f%%)", x, id(vol_pct));
          id(vol_pct) = x * 100.0f;
          id(vol_speaker).publish_state(id(vol_pct));

# NOTE (v0.14.0): the "Speaker Enabled" switch used to live here (template,
# `restore_mode: RESTORE_DEFAULT_ON`). At boot it fired `speaker.mute_off`
# — a write on the SAME I2S bus as the wake word engine and the speaker, and
# it only duplicated what the `number` "Volume da coluna" already does. It was not
# referenced by any HA automation/card. Removed (it was item 4 of the
# PROXIMOS-PASSOS cleanup list).

# --- BACKLIGHT (GPIO42) — without this the panel stays dark ------------------
output:
  - platform: ledc
    pin: GPIO42
    id: backlight_output
    inverted: true

light:
  - platform: monochromatic
    id: screen_light
    name: "Ecrã"
    icon: "mdi:television"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# --- VOICE ASSISTANT ---------------------------------------------------------
micro_wake_word:
  id: mww
  # true (ESPHome default): the engine stops as soon as it detects the wake word, which
  # FREES THE I2S BUS for the speaker. Without this the engine held the
  # bus during the conversation and the speaker failed:
  #   [E][i2s_audio.speaker.std]: Parent bus is busy
  #   [E][voice_assistant]: Cannot receive audio, buffer is full
  # Whoever restarts it is the voice_assistant on_end (further below).
  stop_after_detection: true
  # Models the same as the manufacturer's official config for this board
  # (Spotpear_TV.yaml). The author tested in the HA app and "Okay Nabu" is what
  # works best with his accent. Bare names = official repository
  # github.com/esphome/micro-wake-word-models (models/v2/<name>.json).
  models:
    - model: okay_nabu
      id: ww_okay_nabu
      # 0.97 (model default) -> 0.90 (12/09) -> 0.93 (17/09).
      # 0.90 was too sensitive: on 17/09, with the TV on, the panel woke
      # BY ITSELF twice (16:30 and 16:47) and sent Hermes transcriptions of
      # TV speech ("e o seu programa interno.", "Aqui. Você está me vendo?").
      # The model is trained in English (trained_languages: [en]); 0.97 was
      # too demanding for the pt-PT accent, but 0.90 fires on background
      # speech. 0.93 is the middle. If it starts firing by itself again, raise it further
      # (0.95) or train a model with the author's voice.
      probability_cutoff: 0.93
    # --- CUSTOM "Ok Hermes" (25/09) ----------------------------------------
    # Model trained in pt on microwakeword.com that the author brought (ok_hermes.zip).
    # Local files, in this folder: the `.json` is the manifest and points to
    # `./ok_hermes.tflite` (it has to sit next to it, with this name). Verified before
    # installing: INT8 TFLite with input [1,3,40] and output [1,1] — the signature
    # of microWakeWord v2, which is the ONLY family that runs on this board (no
    # `.pmdl`/`.onnx`/ESP-SR). md5 of the tflite: 25eeaea2cf8a3a8492bf3b4016de0993.
    # It sits NEXT TO okay_nabu: this is the dedicated model, the other one (0.93) already
    # fires on "okay hermes" and serves as a safety net.
    - model: models/ok_hermes.json
      id: ww_ok_hermes
      # 0.50 = value delivered by the training. Do NOT touch before measuring on the
      # "Ultima wake word" sensor (it reports the model and the time of every trigger). Raise it if
      # it wakes by itself with the TV/background speech — with okay_nabu at 0.90 that
      # happened 3x on 17/09, and at 0.93 it stopped.
      # 26/09/2026: MEASURED FAILING with the TV on — at 0.50 the panel woke ~20x
      # in one afternoon (13:38-19:32), all with TV speech ("...coracao cremoso de
      # Nutella...", "...voce realmente quer que eu faca isso?"), almost all of them
      # answering "Nao percebi". The okay_nabu (0.93) did not fire ONCE in the same
      # period. 0.50 -> 0.90 = at the level of what proved safe.
      # If it starts firing by itself again, the next step is to REMOVE this model: the
      # okay_nabu alone already covers "okay nabu" and "okay hermes".
      probability_cutoff: 0.9
    # ONLY this model (17/09). Measured on the "Ultima wake word" sensor:
    #   "okay nabu"   -> fires (5 stars, author)
    #   "okay hermes" -> ALSO fires, through this model (close phrase)
    #   "hey nabu"    -> does not fire
    #   "hey hermes"  -> does not fire (the EN hey_hermes model, miketomkins,
    #                    v1.0.0, was tested and removed: it does not answer the
    #                    author's voice, took up arena and had cutoff 0.32)
    # The two wake words the author uses are therefore covered here.
    # Cost: this sensitivity (0.93) also accepts TV speech -> 17/09
    # it fired by itself 3x. If it happens again, the right path is to train
    # a model with his voice (microwakeword.com), not to tighten the cutoff.
  on_wake_word_detected:
    - logger.log:
        format: "Wake word detetada: %s"
        args: ["wake_word.c_str()"]
    # Leaves a trace in HA of WHICH model fired and at what time. The board log
    # is not kept, so an "invisible" trigger (17/09: the panel
    # woke by itself twice with the TV on) had no proof at all.
    - text_sensor.template.publish:
        id: ww_txt
        state: !lambda |-
          auto t = id(sntp_time).now();
          char b[64];
          if (t.is_valid()) {
            snprintf(b, sizeof(b), "%s %02u/%02u %02u:%02u", wake_word.c_str(),
                     t.day_of_month, t.month, t.hour, t.minute);
          } else {
            snprintf(b, sizeof(b), "%s", wake_word.c_str());
          }
          return {b};
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# v0.15.14 (18/10/2026) — THE RED ICON STOPS SHOWING WHEN NOTHING IS SAID.
#   Measured: the conversation window opens the microphone; if the VAD fires on noise (or
#   the user does not speak), whisper returns empty text and HA ends the pipeline
#   with the error `stt-no-text-recognized` (default_pipeline.py). `on_error` painted
#   the error screen (state 4) for 15 s. Now that code is treated as
#   "ninguem falou" (nobody spoke): back to idle and to the wake word engine, without an alarm.
# v0.15.15 (18/10/2026) — SCREEN STUCK ON "A FALAR" WITH NO SOUND (Parent bus is busy).
#   Seen right after the silence test: HA asked for the TTS, the wake word
#   engine was holding the I2S bus and the speaker kept repeating
#   "[E][i2s_audio.speaker:115] Driver failed to start; retrying in 1 second /
#   Parent bus is busy" — without `on_tts_stream_end` the va_state never went back to 0 and
#   the normal watchdog (which counts from the last state CHANGE) did not
#   fire. Remedies: (a) `micro_wake_word.stop` in `on_tts_stream_start` and in the
#   2 s interval whenever va_state is 2/3; (b) the silence branch stopped
#   starting the engine by hand (that is `on_end`'s job, proven); (c) new guard
#   in (1b): TTS requested >15 s ago without the speaker running -> release.
voice_assistant:
  id: va
  microphone: box_mic
  speaker: box_speaker
  # Connects the local wake word engine to the assistant: it is what lets HA
  # list/choose the wake word model (without this the selects stay unavailable)
  micro_wake_word: mww
  use_wake_word: false
  # IMPORTANT: it has to be FALSE. With true, ESPHome sends the
  # VOICE_ASSISTANT_REQUEST_USE_WAKE_WORD flag in the request to HA, and HA then does
  # wake word detection on the audio instead of transcribing — the pipeline
  # ended with no STT at all. The wake word is detected locally by
  # micro_wake_word, which calls voice_assistant.start with the wake_word.
  # v0.15.13 — 3 -> 1. ESPHome noise suppression (Speex) at the maximum level
  # eats the fricative sounds: measured with the assist_pipeline log, "janelas" came out as
  # "anelas" (loses the J), "vermelho" came out "bremeiro"/"bromeio" (loses the V) and
  # a proper noun came out "li li". The command matched no phrase, so it fell
  # back to the agent
  # and the reply went from 0.1 s to 9-14 s. Level 1 cleans the background without spoiling
  # the consonants.
  noise_suppression_level: 1
  # v0.15.13 — 31 -> 24 dBFS. At the maximum the AGC lifted the background so much that the VAD
  # fired on house noise and the consonants got compressed. 24 dBFS
  # still gives plenty of level at 1-2 m from the panel.
  auto_gain: 24dBFS
  # ⚠️ CRITICAL for "it hears too much": the default value is 300s (5 MINUTES!).
  # During that period the board keeps accepting speech WITHOUT needing the wake word —
  # it catches conversations and house noise, transcribes junk and pushes it to Hermes
  # (slow). That is how a "tipo cai louco Então já a..." turned up, coming from
  # the television. With 5s it only accepts an immediate follow-up and requires the
  # wake word again. NEVER leave it at the default value.
  # v0.15.9: 5s -> 8s. This field does NOT open a listening window (it only resets the
  # conversation_id, voice_assistant.cpp:373) — what opens it is `conv_janela`.
  conversation_timeout: 8s
  # 1.0 (and not 2.0). HA already applies auto_gain at 31 dBFS on the microphone
  # audio; on top of that came a 2x digital gain, which lifted the
  # background noise to ~40% of the scale and harmed the VAD and the transcription
  # (e.g. "que horas sao" transcribed as "Que oracao!").
  volume_multiplier: 1.0
  on_start:
    - logger.log: "Pipeline iniciada"
    # v0.15.17: the HUD line of the previous reply leaves the screen on wake-up.
    - text.set:
        id: hud_linha
        value: ""
    # v0.15.9: if this pipeline was NOT opened by the follow-up window, it is a
    # new wake word -> the "respostas seguidas" chain starts again from zero.
    - if:
        condition:
          lambda: "return !id(conv_espera);"
        then:
          - lambda: "id(conv_count) = 0;"
    - script.execute: {id: hud_set, state: 1}
    # Frees the I2S bus for the speaker while the conversation runs.
    - micro_wake_word.stop:
        id: mww
  on_listening:
    - logger.log: "Assistente a ouvir..."
    - script.execute: {id: hud_set, state: 1}
  on_stt_vad_end:
    - script.execute: {id: hud_set, state: 2}
    # v0.15.9: there was speech already -> the follow-up window did its job. Closing
    # here (and not in on_start, which fires before anyone speaks) is what stops
    # `conv_janela` from sending a `voice_assistant.stop` in the middle of a reply.
    - script.stop: conv_janela
    - lambda: "id(conv_espera) = false;"
  on_stt_end:
    - logger.log: "STT terminado"
    - script.execute: {id: hud_set, state: 2}
  on_tts_start:
    - logger.log: "A processar resposta..."
    - script.execute: {id: hud_set, state: 3}
  on_tts_end:
    - logger.log: "Resposta falada"
  # The on_tts_end above fires when the TTS URL is ready — NOT when the
  # audio finishes playing (there can be 30+ s between the two). The real playback
  # state is in these two triggers.
  on_tts_stream_start:
    # v0.15.15: the speaker is going to need the I2S bus — the wake word engine
    # has to get out of the way BEFORE the first byte (otherwise: "Parent bus is busy"
    # in a loop and the screen stuck on "a falar").
    - micro_wake_word.stop:
        id: mww
    - lambda: "id(tts_pend_ms) = millis();"
    - script.execute: {id: hud_set, state: 3}
  on_tts_stream_end:
    - lambda: "id(tts_pend_ms) = 0;"
    # The last byte has already left for the speaker. What returns the engine to listening
    # and the screen to "em espera" is mww_resume, which waits for the I2S bus (the
    # click of the speaker switching off) instead of counting a fixed time.
    # v0.15.9: it goes through conversation mode — if the chain has not reached the ceiling
    # yet (`Respostas seguidas`), it reopens the microphone without a wake word; if not, it is
    # `conv_followup` that calls mww_resume (the old behaviour).
    - script.execute: {id: conv_followup}
  on_error:
    - logger.log: "Erro no assistente"
    # v0.15.9: an error closes the chain of follow-ups (do not insist on top of an error).
    - lambda: |-
        id(conv_espera) = false;
        id(conv_count) = 0;
        id(tts_pend_ms) = 0;
        ESP_LOGW("vaerro", "codigo=%s mensagem=%s", code.c_str(), message.c_str());
    - script.stop: conv_janela
    # v0.15.14: "nobody spoke" (the VAD fired on noise and the STT returned empty)
    # is NOT a fault — HA closes the pipeline with `stt-no-text-recognized`. Going
    # back to idle without painting the error screen avoids the red icon on every silence.
    - if:
        condition:
          lambda: 'return code == "stt-no-text-recognized";'
        then:
          - logger.log: "Nada dito -> volta a espera sem erro"
          - script.execute: {id: hud_set, state: 0}
          # v0.15.15: do NOT start the engine here. What returns it to listening is
          # `on_end` (waits 2 s and tests the state), which is already the proven path;
          # starting it by hand put the engine grabbing the I2S before the speaker
          # released the bus -> "Parent bus is busy" in a loop.
        else:
          - script.execute: {id: hud_set, state: 4}
          - micro_wake_word.start:
              id: mww
  on_end:
    - logger.log: "Conversa terminada"
    # v0.15.9: the pipeline has closed -> the waiting window no longer exists.
    - lambda: "id(conv_espera) = false;"
    # This trigger fires when the pipeline closes — tens of seconds BEFORE
    # the audio finishes playing. That is why the screen is NOT restored here and the
    # engine is not started: doing so puts the engine grabbing the I2S bus in the middle of
    # playback and the speaker never starts — the screen said "a falar" and nothing
    # was heard ("Cannot receive audio, buffer is full"). The normal case is
    # handled in on_tts_stream_end. Here only the net for replies with NO speech
    # at all remains, which never get to fire that trigger.
    - delay: 2s
    - if:
        condition:
          lambda: "return id(va_state) != 3;"
        then:
          - script.execute: {id: mww_resume}

# --- ST7796 SCREEN (mipi_spi, 480x320) ---------------------------------------
display:
  - platform: mipi_spi
    id: main_display
    model: ST7796
    data_rate: 40MHz
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: true
    dimensions:
      height: 320
      width: 480
    cs_pin: GPIO5
    dc_pin: GPIO47
    rotation: ${rotate_display}
    # ⚠️ `never`: what drives the drawing is the `ecra_loop` script (rate set by the
    # `number` "Animação (fps)"). With a fixed `update_interval`, tuning the
    # smoothness would cost a ~10 min compile+OTA per attempt.
    update_interval: never
    lambda: |-
      it.fill(Color(0, 0, 0));

      // --- tempo: a animacao avanca em graus/segundo, nao por frame ---------
      static uint32_t ecra_ultimo_ms = 0;
      uint32_t ecra_agora = millis();
      float dt = (ecra_agora - ecra_ultimo_ms) / 1000.0f;
      ecra_ultimo_ms = ecra_agora;
      if (dt < 0.0f || dt > 1.0f) dt = 1.0f;

      // --- estado: cor, velocidade da rotacao e pulso -----------------------
      // O ecra de media exige `est == 0`: o TTS do assistente passa pelo
      // announcement_pipeline deste media player (`voice_assistant: TTS stream
      // start` -> `speaker_media_player: State changed to ANNOUNCING`), logo
      // `mp_playing` fica a true durante CADA resposta falada e, sem a guarda,
      // o ecra trocava para "A TOCAR" a meio da conversa (visto pelo autor).
      int est = id(va_state);
      bool media = id(mp_playing) && est == 0;
      // EM ESPERA: BRANCO (pedido do autor, 26/09 — era o mesmo ciano do "A FALAR"
      // e no painel nao se distinguiam; agora o ciano e' so do "A FALAR").
      Color cor(0xFF, 0xFF, 0xFF);
      float vel = 9.0f, pulso = 0.0f;
      if (media)         { cor = Color(0x1E, 0xD7, 0x60); vel = 24.0f; pulso = 0.5f; }
      else if (est == 1) { cor = Color(0x19, 0xF0, 0xD8); vel = 30.0f; pulso = 1.0f; }
      else if (est == 2 && id(trabalho).state) {
        // A TRABALHAR (24/10/2026): violeta e rotacao muito rapida — distingue-se
        // do ambar do "a pensar" sem precisar de texto no ecra.
        cor = Color(0xB3, 0x6B, 0xFF); vel = 160.0f; pulso = 0.2f;
      }
      else if (est == 2) { cor = Color(0xFF, 0xB3, 0x00); vel = 96.0f; pulso = 0.4f; }
      else if (est == 3) { cor = Color(0x00, 0xE5, 0xFF); vel = 42.0f; pulso = 0.8f; }
      else if (est == 4) { cor = Color(0xFF, 0x4D, 0x5E); vel = 3.0f;  pulso = 0.0f; }

      id(rot_deg) += vel * dt;
      if (id(rot_deg) >= 36000.0f) id(rot_deg) -= 36000.0f;
      float rot = id(rot_deg);

      // --- helpers ----------------------------------------------------------
      // O ESPHome nao tem alpha: o que no canvas do jarvis_ai era `globalAlpha`
      // e misturado aqui com o PRETO do fundo antes de escrever o pixel (mesmo
      // resultado, porque o fundo e preto).
      auto mist = [](Color c, float a) {
        return Color((uint8_t) (c.r * a), (uint8_t) (c.g * a), (uint8_t) (c.b * a));
      };
      // Segmento de anel entre r1 e r2, de a0 a a1 graus (0 = topo, horario).
      // Em quads de ~5 graus, 2 triangulos cada (nao ha primitiva de quadrilatero).
      auto seg = [&](int ccx, int ccy, float r1, float r2, float a0, float a1, Color c) {
        int n = (int) ((a1 - a0) / 5.0f);
        if (n < 1) n = 1;
        for (int i = 0; i < n; i++) {
          float s = (a0 + (a1 - a0) * i / n - 90.0f) * 0.0174533f;
          float e = (a0 + (a1 - a0) * (i + 1) / n - 90.0f) * 0.0174533f;
          int x1 = ccx + (int) (cosf(s) * r2), y1 = ccy + (int) (sinf(s) * r2);
          int x2 = ccx + (int) (cosf(e) * r2), y2 = ccy + (int) (sinf(e) * r2);
          int x3 = ccx + (int) (cosf(e) * r1), y3 = ccy + (int) (sinf(e) * r1);
          int x4 = ccx + (int) (cosf(s) * r1), y4 = ccy + (int) (sinf(s) * r1);
          it.filled_triangle(x1, y1, x2, y2, x3, y3, c);
          it.filled_triangle(x1, y1, x3, y3, x4, y4, c);
        }
      };
      // Anel tracejado: dash/gap em pixeis de arco, `off` desloca o padrao —
      // e isto que faz a rotacao (nao existe primitiva de arco tracejado).
      auto tracejado = [&](int ccx, int ccy, float r, float w, Color c, float dash, float gap, float off) {
        float circ = 6.2831853f * r;
        float per = dash + gap;
        float px = -fmodf(off, per);
        if (px > 0.0f) px -= per;
        while (px < circ) {
          float d0 = px > 0.0f ? px : 0.0f;
          float d1 = (px + dash) < circ ? (px + dash) : circ;
          if (d1 > d0) {
            seg(ccx, ccy, r - w * 0.5f, r + w * 0.5f, d0 / circ * 360.0f, d1 / circ * 360.0f, c);
          }
          px += per;
        }
      };
      // O anel: exterior solido + 3 tracejados a rodar + 60 marcas radiais +
      // nucleo. Raios do canvas original, relativos a `base`.
      auto reactor = [&](int ccx, int ccy, float base, Color c, float pulso) {
        float b = base * (1.0f + 0.012f * (1.0f + pulso * 3.0f) * sinf(ecra_agora / 300.0f));
        it.filled_ring(ccx, ccy, (int) (b - 1.5f), (int) (b + 1.5f), mist(c, 0.90f));
        tracejado(ccx, ccy, b * 0.86f, 2.0f, mist(c, 0.45f), 40.0f, 18.0f, rot * 2.0f);
        tracejado(ccx, ccy, b * 0.72f, 5.0f, mist(c, 0.25f), 4.0f, 10.0f, -rot * 3.0f);
        tracejado(ccx, ccy, b * 0.58f, 2.0f, mist(c, 0.60f), 90.0f, 40.0f, rot * 1.2f);
        for (int i = 0; i < 60; i++) {
          float a = (i / 60.0f) * 6.2831853f + rot / 180.0f;
          float r1 = b * 1.06f, r2 = b * (i % 5 == 0 ? 1.12f : 1.09f);
          it.line(ccx + (int) (cosf(a) * r1), ccy + (int) (sinf(a) * r1),
                  ccx + (int) (cosf(a) * r2), ccy + (int) (sinf(a) * r2),
                  mist(c, i % 5 == 0 ? 0.80f : 0.30f));
        }
        // Nucleo: nao ha gradiente radial nem blur no ESPHome — aproxima-se com
        // circulos concentricos, do maior/apagado para o menor/brilhante.
        for (int i = 0; i < 10; i++) {
          float f = i / 10.0f;
          it.filled_circle(ccx, ccy, (int) (b * 0.42f * (1.0f - f)),
                           mist(c, 0.05f + 0.30f * powf(f, 1.6f)));
        }
      };

      // --- relogio: a UNICA informacao fora do anel (pedido do autor, 26/09) --
      // O ecra ficou mais limpo: sairam o dia da semana, a data, a hora do topo e
      // a percentagem da bateria do rodape. O relogio desceu para o CENTRO do
      // anel, no lugar do "EM ESPERA" (ver o HUD de voz mais abaixo). A hora
      // continua a vir do sntp. Os sensores de bateria/uptime continuam no HA —
      // so sairam do ECRÃ. Para voltar atras: o caminho seguro e' gravar o
      // binario da versao anterior, que fica no NAS em
      // Master/Hermes/esp32-max35-tv/historico/ (max35tv-v0.15.4-2026.9.0-ota.bin);
      // refazer isto a mao e' repor o bloco de desenho descrito no topo deste
      // ficheiro (v0.15.5).
      auto agora_t = id(sntp_time).now();
      // Segundos que faltam ao proximo temporizador (calculado no interval de
      // 1 s). -1 = nao ha nenhum. Serve os dois ecras (espera e media).
      int restante = id(contagem_rest);

      if (id(ecra_alarme)) {
        // --- ALARME A TOCAR (29/10/2026): despertador animado ---------------
        // Pedido do autor: durante os 10 s do toque o ecra mostra um relogio
        // de alarme a tocar. Desenhado a primitivas (nao ha fonte com emoji).
        uint32_t ams = millis();
        int cx = 240 + (int) (sinf(ams / 70.0f) * 5.0f);   // treme
        int cy = 150;
        Color verm(0xFF, 0x3B, 0x30);
        // ondas sonoras a sair dos dois lados
        for (int k = 0; k < 3; k++) {
          float ph = fmodf(ams / 900.0f + k / 3.0f, 1.0f);
          int rr = 74 + (int) (ph * 46.0f);
          Color cw = mist(verm, 0.60f * (1.0f - ph));
          it.circle(cx, cy, rr, cw);
          it.circle(cx, cy, rr + 1, cw);
        }
        // campainhas (a tremer em oposicao) + hastes
        int bal = (int) (sinf(ams / 55.0f) * 4.0f);
        it.filled_circle(cx - 50, cy - 62 + bal, 16, verm);
        it.filled_circle(cx + 50, cy - 62 - bal, 16, verm);
        it.filled_rectangle(cx - 54, cy - 50 + bal, 8, 22, mist(verm, 0.75f));
        it.filled_rectangle(cx + 46, cy - 50 - bal, 8, 22, mist(verm, 0.75f));
        // corpo: mostrador escuro com aro grosso
        it.filled_circle(cx, cy, 62, Color(0x1C, 0x02, 0x02));
        it.filled_ring(cx, cy, 56, 64, verm);
        // marcas das horas
        for (int h = 0; h < 12; h++) {
          float a = h * 0.5235988f;
          bool grande = (h % 3 == 0);
          float r1 = grande ? 40.0f : 46.0f, r2 = 52.0f;
          it.line(cx + (int) (cosf(a) * r1), cy + (int) (sinf(a) * r1),
                  cx + (int) (cosf(a) * r2), cy + (int) (sinf(a) * r2),
                  mist(verm, grande ? 0.95f : 0.45f));
        }
        // ponteiros: o dos minutos anda depressa (e o "a tocar"), o das horas devagar
        float am = ams / 180.0f - 1.5707963f;
        float ah = ams / 2200.0f - 1.5707963f;
        it.line(cx, cy, cx + (int) (cosf(ah) * 28), cy + (int) (sinf(ah) * 28), mist(verm, 0.85f));
        it.line(cx, cy, cx + (int) (cosf(am) * 42), cy + (int) (sinf(am) * 42), Color(0xFF, 0xFF, 0xFF));
        it.filled_circle(cx, cy, 4, Color(0xFF, 0xFF, 0xFF));
        // pes
        it.line(cx - 34, cy + 52, cx - 52, cy + 74, verm);
        it.line(cx + 34, cy + 52, cx + 52, cy + 74, verm);
        // legenda
        it.print(240, 248, id(font_med), verm, TextAlign::CENTER, "ALARME");
      } else if (media) {
        // --- ECRÃ DE MEDIA: o anel passa a mostrar o VOLUME -----------------
        int ccx = 130, ccy = 160;
        float base = 92.0f;
        float v = id(vol_pct);
        if (v < 0.0f) v = 0.0f;
        if (v > 100.0f) v = 100.0f;
        reactor(ccx, ccy, base, cor, 0.5f);
        // Arco cheio do volume por cima do anel (0 = topo, sentido horario).
        seg(ccx, ccy, base * 0.86f - 3.0f, base * 0.86f + 3.0f, 0.0f, 360.0f * v / 100.0f,
            Color(0x3C, 0xFF, 0x8C));
        it.printf(ccx, ccy, id(font_med), Color(0x3C, 0xFF, 0x8C), TextAlign::CENTER, "%d%%", (int) (v + 0.5f));
        // Coluna da direita: estado, titulo (escrito pelo HA) e volume.
        it.print(258, 78, id(font_normal), Color(0x1E, 0xD7, 0x60), TextAlign::TOP_LEFT, "A TOCAR");
        std::string titulo = id(mp_titulo).state;
        if (titulo.empty()) titulo = "Radio / Musica";
        if (titulo.size() > 18) titulo = titulo.substr(0, 17) + ".";
        it.print(258, 118, id(font_normal), Color(255, 255, 255), TextAlign::TOP_LEFT, titulo.c_str());
        it.printf(258, 156, id(font_small), Color(150, 150, 150), TextAlign::TOP_LEFT, "volume %d%%", (int) (v + 0.5f));
        it.rectangle(258, 186, 200, 10, Color(60, 60, 60));
        it.filled_rectangle(259, 187, (int) (198 * v / 100.0f), 8, Color(0x1E, 0xD7, 0x60));
        // Contagem do temporizador tambem aqui: depois de uma resposta falada
        // o painel pode ficar uns segundos neste ecra e a contagem desaparecia.
        if (restante >= 0) {
          char mbuf[16];
          if (restante >= 3600) snprintf(mbuf, sizeof(mbuf), "%d:%02d:%02d", restante / 3600, (restante % 3600) / 60, restante % 60);
          else snprintf(mbuf, sizeof(mbuf), "%02d:%02d", restante / 60, restante % 60);
          it.print(240, 300, id(font_med), Color(0xFF, 0x4D, 0x5E), TextAlign::CENTER, mbuf);
        }
        // Linha de HUD (marcador [HW:/display/info]) no ecra de media.
        std::string linha_m = id(hud_linha).state;
        if (!linha_m.empty()) {
          if (linha_m.size() > 14) linha_m = linha_m.substr(0, 13) + ".";
          it.print(258, 208, id(font_small), Color(0xC8, 0xC8, 0xC8), TextAlign::TOP_LEFT, linha_m.c_str());
        }
      } else {
        // --- HUD DE VOZ: o anel de estado -----------------------------------
        reactor(240, 152, 118.0f, cor, pulso);
        // Aviso de volume durante 1,5 s depois de um clique no botao: sem isto
        // um clique para mexer no volume nao dava retorno NENHUM quando nao ha
        // media a tocar (com media, o ecra de media ja mostra o volume).
        if (millis() < id(vol_aviso_ms)) {
          float vv = id(vol_pct);
          if (vv < 0.0f) vv = 0.0f;
          if (vv > 100.0f) vv = 100.0f;
          it.printf(240, 152, id(font_med), Color(0x3C, 0xFF, 0x8C), TextAlign::CENTER, "%d%%", (int) (vv + 0.5f));
        } else {
          if (est == 0) {
            // Em espera o CENTRO mostra as HORAS, em branco (pedido do autor,
            // 26/09): o "EM ESPERA" saiu e o relogio que estava no topo desceu
            // para aqui. font_med (40 px) porque o centro do anel e' largo.
            if (agora_t.is_valid()) {
              it.strftime(240, 152, id(font_med), Color(0xFF, 0xFF, 0xFF), TextAlign::CENTER, "%H:%M", agora_t);
            }
          } else {
            const char *stxt = "A OUVIR";
            if (est == 2)      stxt = "A PENSAR";
            else if (est == 3) stxt = "A FALAR";
            else if (est == 4) stxt = "ERRO";
            it.print(240, 152, id(font_normal), cor, TextAlign::CENTER, stxt);
          }
        }
        // --- CONTAGEM DO TEMPORIZADOR (29/10/2026) ------------------------
        // Em vermelho, por baixo do relogio (o valor vem do `contagem_fim`,
        // epoch UTC escrito pelo HA, e desce ao segundo).
        if (restante >= 0) {
          char cbuf[16];
          if (restante >= 3600) snprintf(cbuf, sizeof(cbuf), "%d:%02d:%02d", restante / 3600, (restante % 3600) / 60, restante % 60);
          else snprintf(cbuf, sizeof(cbuf), "%02d:%02d", restante / 60, restante % 60);
          it.print(240, 196, id(font_med), Color(0xFF, 0x4D, 0x5E), TextAlign::CENTER, cbuf);
        }
        // Linha de HUD dentro do anel, por baixo do relogio/estado. Vazia = nada.
        std::string linha = id(hud_linha).state;
        if (!linha.empty()) {
          if (linha.size() > 20) linha = linha.substr(0, 19) + ".";
          // Com contagem o texto desce e encolhe (para nao colar ao MM:SS); sem
          // contagem fica exactamente como estava.
          if (restante >= 0) {
            it.print(240, 236, id(font_small), Color(0xC8, 0xC8, 0xC8), TextAlign::CENTER, linha.c_str());
          } else {
            it.print(240, 205, id(font_normal), Color(0xC8, 0xC8, 0xC8), TextAlign::CENTER, linha.c_str());
          }
        }
      }

      // --- rodape: SAIRAM a data e a bateria (pedido do autor, 26/09: ecra mais
      // clean). O valor da bateria continua a chegar ao HA pelo sensor
      // `Bateria` (e ha o gestor de bateria do painel a vigia-lo) — so deixou
      // de ser desenhado aqui. Para repor, era um `it.printf(470, 292, ...)`
      // com id(battery_percentage).state.

# NOTE (12/09/2026): this board revision has NO touchscreen — the GT911 does not
# exist/does not respond and the manufacturer's official config does not define it either.
# Block removed. If hardware with touch is ever confirmed, the block was:
#   touchscreen: [{platform: gt911, i2c_id: bus_a, address: 0x5D|0x14, display: main_display}]
#

# --- CAMERA (GC0308/OV5640, auto-detected) -----------------------------------
# Pins from the manufacturer's official file (spotpear-tv_hw.yaml).
# GPIO3 is a strapping pin but it is used here as D5 (confirmed in the official one).
# --- CAMERA (disabled on purpose) -------------------------------------------
# No use as a motion sensor: the board has no infrared LED (at
# night it sees nothing) and ESPHome does not do image motion detection.
# Keeping this cost 12 KB of RAM, 65 KB of flash and ~1.2 MB of PSRAM.
# To put it back: remove the '#' from this block.
# esp32_camera:
#   id: lcd_camera
#   name: "Câmara"
#   icon: "mdi:camera"
#   external_clock:
#     pin: GPIO41
#     frequency: 20MHz
#   i2c_id: bus_a
#   data_pins:
#     - GPIO12
#     - GPIO4
#     - GPIO11
#     - GPIO17
#     - GPIO18
#     - GPIO3
#     - GPIO1
#     - GPIO2
#   vsync_pin: GPIO39
#   href_pin: GPIO40
#   pixel_clock_pin: GPIO38
#   resolution: 640x480
#   jpeg_quality: 10
#   max_framerate: 10fps
#   idle_framerate: 0.1fps
#   frame_buffer_count: 2
#   frame_buffer_location: PSRAM
#   # This sensor (GC0308) is very weak in low light — push gain/exposure
#   brightness: 2
#   contrast: 0
#   aec2: true
#   ae_level: 2
#   agc_gain_ceiling: 32X
#
# --- CLOCK / TIME ------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time

# --- FONTS -------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Roboto"
    id: font_normal
    size: 24
    glyphs: " %°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÇÉÊÍÓÔÕÚàáâãçéêíóôõú:.,;!?()-_/"
  # Big number: the volume % (media screen) and the TIME in the centre of the ring
  # when idle (the ":" came in on 26/09 because of that).
  - file: "gfonts://Roboto"
    id: font_med
    size: 40
    glyphs: "0123456789%:"
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
    glyphs: " %°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÇÉÊÍÓÔÕÚàáâãçéêíóôõú:.,;!?()-_/"

# --- STATE SENSORS -----------------------------------------------------------
debug:
  update_interval: 60s

text_sensor:
  # 29/10/2026 — timer countdown diagnostics: end/now/remaining just
  # as the firmware sees them. It is the first place to look if the screen shows nothing.
  - platform: template
    name: "Depuracao contagem"
    id: dbg_contagem
    icon: "mdi:bug"
  # Diagnostics: why it rebooted last time (brownout / watchdog / panic /
  # software). Added to investigate the reboots of build 2026.9.0.
  - platform: debug
    reset_reason:
      name: "Motivo do ultimo reset"
      entity_category: diagnostic
  - platform: template
    name: "Uptime (texto)"
    id: uptime_txt
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint32_t s = (uint32_t) id(uptime_s).state;
      char b[32];
      snprintf(b, sizeof(b), "%ud %02uh %02um", s / 86400u, (s % 86400u) / 3600u, (s % 3600u) / 60u);
      return {b};

  - platform: template
    name: "Assistente Estado"
    id: va_state_text
    update_interval: 5s
    lambda: |-
      if (id(va).is_running()) return {"a ouvir/falar"};
      return {"pronto"};

  # Last wake word trigger (model + time), written by
  # micro_wake_word's `on_wake_word_detected`. It exists ONLY for diagnostics:
  # the board log is not kept and without this there is no proof of when/who
  # woke the panel (17/09: it woke by itself twice with the TV on).
  - platform: template
    name: "Ultima wake word"
    id: ww_txt
    icon: "mdi:microphone-message"
    entity_category: diagnostic
    update_interval: never
    lambda: return {""};

  # Firmware version + the ESPHome that compiled it. HA already shows this on the
  # device page (sw_version), but this way it is visible on a
  # dashboard card. `ESPHOME_VERSION` is a macro that the build writes (the version of
  # ESPHome with which this binary was compiled).
  - platform: template
    name: "Versão do firmware"
    id: fw_version_txt
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 6h
    lambda: return {"${fw_version} (ESPHome " ESPHOME_VERSION ")"};
