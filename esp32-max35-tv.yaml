  # ---------------------------------------------------------------------
  # Animações. `loop` repete; o "vai-e-vem" de duas metades faz-se com duas
  # animações e `on_stop` a arrancar a contrária — MAS quando o vai-e-vem é
  # simétrico há melhor: `timing: round_trip` (o ESPHome TEM round_trip), que
  # dentro da MESMA animação vai de `from` a `to` e volta; como acaba no valor
  # inicial, o `loop` não dá salto nenhum.
  # Só x/y/opa/transform_* são animáveis: largura e altura NÃO.
  # ---------------------------------------------------------------------
  animations:
    # (a respiracao do mockup saiu: animar o grupo de ecra inteiro obrigava o
    # LVGL a redesenhar 480x320 a 60 fps, saturava o SPI a 40 MHz e a voz
    # ficava lenta e com falhas — medido no painel a 29/10)
    # v0.17.9 — alarme: era `loop` de -5 a 5 em 90 ms, ~11 saltos por segundo,
    # mais depressa do que o painel desenha (tremia, não abanava). Agora é um
    # vaivém contínuo de 380 ms com ease_in_out.
    - id: tremer
      duration: 900ms
      loop: true
      timing:
        - type: round_trip
          pause: 0.08
        - type: ease_in_out
      widgets:
        - id: robo
          x:
            from: -4
            to: 4
    - id: inclina_a
      duration: 1200ms
      on_stop:
        # `on_stop` também corre quando o `lvgl.animation.stop` a interrompe — sem
        # esta guarda, parar A arrancava B e B arrancava A (ping-pong eterno).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: inclina_b
      widgets:
        - id: cabeca
          transform_rotation:
            from: 0
            to: 5
    - id: inclina_b
      duration: 1200ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: inclina_a
      widgets:
        - id: cabeca
          transform_rotation:
            from: 5
            to: 0
    - id: balanca_a
      duration: 1400ms
      on_stop:
        # `on_stop` também corre quando o `lvgl.animation.stop` a interrompe — sem
        # esta guarda, parar A arrancava B e B arrancava A (ping-pong eterno).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: balanca_b
      widgets:
        - id: cabeca
          transform_rotation:
            from: 0
            to: 3
    - id: balanca_b
      duration: 1400ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: balanca_a
      widgets:
        - id: cabeca
          transform_rotation:
            from: 3
            to: 0
    - id: boca_a
      duration: 90ms
      on_stop:
        # `on_stop` também corre quando o `lvgl.animation.stop` a interrompe — sem
        # esta guarda, parar A arrancava B e B arrancava A (ping-pong eterno).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: boca_b
      widgets:
        - id: boca_aberta
          y:
            from: 220
            to: 213
    - id: boca_b
      duration: 90ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: boca_a
      widgets:
        - id: boca_aberta
          y:
            from: 213
            to: 220
    - id: onda_a
      duration: 700ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: onda1
          opa:
            from: 100%
            to: 25%
        - id: onda2
          opa:
            from: 100%
            to: 25%
        - id: onda3
          opa:
            from: 100%
            to: 25%
    - id: ponto1_anima
      duration: 900ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: ponto1
          opa:
            from: 100%
            to: 30%
    - id: ponto2_anima
      duration: 900ms
      start_delay: 200ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: ponto2
          opa:
            from: 100%
            to: 30%
    - id: ponto3_anima
      duration: 900ms
      start_delay: 400ms
      loop: true
      timing:
        - type: round_trip
      widgets:
