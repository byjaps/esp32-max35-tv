              text: ""
              text_font: font_small
              text_color: 0xFF4D4D
              text_align: RIGHT
  animations:
    # respiracao: sobe 3 px e volta (4 s)
    - id: respirar
      duration: 4s
      auto_start: true
      loop: true
      timing: ease_in_out
      widgets:
        - id: robo
          y:
            from: 0
            to: -3
    # ponta da antena a pulsar
    - id: pulso_antena
      duration: 2500ms
      auto_start: true
      loop: true
      timing: round_trip
      widgets:
        - id: ponta
          bg_opa:
            from: 100%
            to: 30%
    # boca a falar (arranca no estado A FALAR)
    - id: falar
      duration: 260ms
      loop: true
      timing: round_trip
      widgets:
        # `height` nao e animavel no LVGL do ESPHome (so min/max_height e as
        # transform_*): a boca abre e fecha por transform_height, com o pivo em
        # baixo para crescer para cima. Medido a 29/10 com o `esphome config`.
        - id: boca_circ
          transform_height:
            from: 55%
            to: 100%
    # alarme: tremer a esquerda/direita
    - id: tremer_alarme
      duration: 160ms
      loop: true
      timing: round_trip
      widgets:
        - id: robo
          x:
            from: -6
            to: 6
    # ondas a pulsar enquanto ouve
    - id: pulsar_ondas
      duration: 900ms
      loop: true
      timing: round_trip
      widgets:
        - id: onda1
          bg_opa:
            from: 100%
            to: 25%
        - id: onda2
          bg_opa:
            from: 60%
            to: 15%
        - id: onda3
          bg_opa:
            from: 35%
            to: 5%

# NOTA (12/09/2026): esta revisão da placa NÃO tem touchscreen — o GT911 não
# existe/ não responde e a config oficial do fabricante também não o define.
# Bloco removido. Se um dia se confirmar hardware com touch, o bloco era:
#   touchscreen: [{platform: gt911, i2c_id: bus_a, address: 0x5D|0x14, display: main_display}]
#

# --- CÂMARA (GC0308/OV5640, auto-detetada) -----------------------------------
# Pinos do ficheiro oficial do fabricante (spotpear-tv_hw.yaml).
# GPIO3 é strapping pin mas é usado aqui como D5 (confirmado no oficial).
# --- CAMARA (desligada de proposito) ----------------------------------------
# Nao serve de sensor de movimento: a placa nao tem LED de infravermelhos (de
# noite nao ve nada) e o ESPHome nao faz deteccao de movimento por imagem.
# Manter isto custava 12 KB de RAM, 65 KB de flash e ~1,2 MB de PSRAM.
# Para voltar a por: tirar os '#' a este bloco.
# esp32_camera:
#   id: lcd_camera
#   name: "Câmara"
#   icon: "mdi:camera"
#   external_clock:
#     pin: GPIO41
#     frequency: 20MHz
#   i2c_id: bus_a
#   data_pins:
#     - GPIO12
#     - GPIO4
#     - GPIO11
#     - GPIO17
#     - GPIO18
#     - GPIO3
#     - GPIO1
#     - GPIO2
#   vsync_pin: GPIO39
#   href_pin: GPIO40
#   pixel_clock_pin: GPIO38
#   resolution: 640x480
#   jpeg_quality: 10
#   max_framerate: 10fps
#   idle_framerate: 0.1fps
#   frame_buffer_count: 2
#   frame_buffer_location: PSRAM
#   # Este sensor (GC0308) e muito fraco com pouca luz — puxar ganho/exposicao
#   brightness: 2
#   contrast: 0
#   aec2: true
#   ae_level: 2
#   agc_gain_ceiling: 32X
#
# --- RELÓGIO / TEMPO ---------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time

# --- FONTES ------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Roboto"
    id: font_normal
    size: 24
    glyphs: " %°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÇÉÊÍÓÔÕÚàáâãçéêíóôõú:.,;!?()-_/"
  # Numero grande: o % do volume (ecra de media) e as HORAS no centro do anel
  # quando esta em espera (o ":" entrou em 26/09 por causa disso).
  - file: "gfonts://Roboto"
    id: font_med
    size: 40
    glyphs: "0123456789%:"
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
    glyphs: " %°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÇÉÊÍÓÔÕÚàáâãçéêíóôõú:.,;!?()-_/"

# --- SENSORES DE ESTADO ------------------------------------------------------
debug:
  update_interval: 60s

text_sensor:
  # 29/10/2026 — diagnostico da contagem do temporizador: fim/agora/rest tal
  # como o firmware os ve. E o primeiro sitio a olhar se o ecra nao mostrar nada.
  - platform: template
    name: "Depuracao contagem"
    id: dbg_contagem
    icon: "mdi:bug"
  # Diagnostico: porque reiniciou a ultima vez (brownout / watchdog / panic /
  # software). Adicionado para investigar os reinicios do build 2026.9.0.
  - platform: debug
    reset_reason:
      name: "Motivo do ultimo reset"
      entity_category: diagnostic
  - platform: template
    name: "Uptime (texto)"
    id: uptime_txt
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      uint32_t s = (uint32_t) id(uptime_s).state;
      char b[32];
      snprintf(b, sizeof(b), "%ud %02uh %02um", s / 86400u, (s % 86400u) / 3600u, (s % 3600u) / 60u);
      return {b};

  - platform: template
    name: "Assistente Estado"
    id: va_state_text
    update_interval: 5s
    lambda: |-
      if (id(va).is_running()) return {"a ouvir/falar"};
      return {"pronto"};

  # Ultimo disparo da wake word (modelo + hora), escrito pelo
  # `on_wake_word_detected` do micro_wake_word. Existe SO para diagnostico:
  # o log da placa nao fica guardado e sem isto nao ha prova de quando/quem
  # acordou o painel (17/09: acordou sozinho duas vezes com a TV ligada).
  - platform: template
    name: "Ultima wake word"
    id: ww_txt
    icon: "mdi:microphone-message"
    entity_category: diagnostic
    update_interval: never
    lambda: return {""};

  # Versao do firmware + do ESPHome que o compilou. O HA ja mostra isto na
  # pagina do device (sw_version), mas assim fica visivel num cartao de
  # dashboard. `ESPHOME_VERSION` e uma macro que o build escreve (versao do
  # ESPHome com que este binario foi compilado).
  - platform: template
    name: "Versão do firmware"
    id: fw_version_txt
    icon: "mdi:tag-outline"
    entity_category: diagnostic
    update_interval: 6h
    lambda: return {"${fw_version} (ESPHome " ESPHOME_VERSION ")"};
