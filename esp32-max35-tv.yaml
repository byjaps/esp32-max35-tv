  # ---------------------------------------------------------------------
  # Animations. `loop` repeats; the two-halves back-and-forth is done with two
  # animations and `on_stop` starting the opposite one — BUT when that back-and-forth is
  # symmetric there is something better: `timing: round_trip` (ESPHome HAS it), which
  # inside the SAME animation goes from `from` to `to` and back; ending at the
  # initial value, so `loop` produces no jump at all.
  # Only x/y/opa/transform_* are animatable: width and height are NOT.
  # ---------------------------------------------------------------------
  animations:
    # (the mockup breathing is gone: animating the whole-screen group forced
    # LVGL to redraw 480x320 at 60 fps, saturated the SPI at 40 MHz and the voice
    # went slow and glitchy — measured on the panel on 29/10)
    # v0.17.9 — alarm: it used to be a `loop` from -5 to 5 in 90 ms, ~11 jumps per second,
    # faster than the panel draws (it trembled, it did not shake). Now it is a
    # continuous 380 ms back-and-forth with ease_in_out.
    - id: tremer
      duration: 900ms
      loop: true
      timing:
        - type: round_trip
          pause: 0.08
        - type: ease_in_out
      widgets:
        - id: robo
          x:
            from: -4
            to: 4
    - id: inclina_a
      duration: 1200ms
      on_stop:
        # `on_stop` also runs when `lvgl.animation.stop` interrupts it — without
        # this guard, stopping A started B and B started A (endless ping-pong).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: inclina_b
      widgets:
        - id: cabeca
          transform_rotation:
            from: 0
            to: 5
    - id: inclina_b
      duration: 1200ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: inclina_a
      widgets:
        - id: cabeca
          transform_rotation:
            from: 5
            to: 0
    - id: balanca_a
      duration: 1400ms
      on_stop:
        # `on_stop` also runs when `lvgl.animation.stop` interrupts it — without
        # this guard, stopping A started B and B started A (endless ping-pong).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: balanca_b
      widgets:
        - id: cabeca
          transform_rotation:
            from: 0
            to: 3
    - id: balanca_b
      duration: 1400ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: balanca_a
      widgets:
        - id: cabeca
          transform_rotation:
            from: 3
            to: 0
    - id: boca_a
      duration: 90ms
      on_stop:
        # `on_stop` also runs when `lvgl.animation.stop` interrupts it — without
        # this guard, stopping A started B and B started A (endless ping-pong).
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: boca_b
      widgets:
        - id: boca_aberta
          y:
            from: 220
            to: 213
    - id: boca_b
      duration: 90ms
      on_stop:
        - if:
            condition:
              lambda: "return id(anim_ok);"
            then:
              - lvgl.animation.start: boca_a
      widgets:
        - id: boca_aberta
          y:
            from: 213
            to: 220
    - id: onda_a
      duration: 700ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: onda1
          opa:
            from: 100%
            to: 25%
        - id: onda2
          opa:
            from: 100%
            to: 25%
        - id: onda3
          opa:
            from: 100%
            to: 25%
    - id: ponto1_anima
      duration: 900ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: ponto1
          opa:
            from: 100%
            to: 30%
    - id: ponto2_anima
      duration: 900ms
      start_delay: 200ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: ponto2
          opa:
            from: 100%
            to: 30%
    - id: ponto3_anima
      duration: 900ms
      start_delay: 400ms
      loop: true
      timing:
        - type: round_trip
      widgets:
        - id: ponto3
          opa:
            from: 100%
            to: 30%
    - id: nota_a
      duration: 2200ms
      loop: true
      widgets:
        - id: nota1
          y:
            from: 150
            to: 88
          opa:
            from: 100%
            to: 10%
    - id: nota_b
      duration: 2200ms
