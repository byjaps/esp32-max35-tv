# NOTE (12/09/2026): this board revision has NO touchscreen — the GT911 does not
# exist/does not respond and the manufacturer's official config does not define it either.
# Block removed. If hardware with touch is ever confirmed, the block was:
#   touchscreen: [{platform: gt911, i2c_id: bus_a, address: 0x5D|0x14, display: main_display}]
#

# --- CAMERA (GC0308/OV5640, auto-detected) -----------------------------------
# Pins from the manufacturer's official file (spotpear-tv_hw.yaml).
# GPIO3 is a strapping pin but it is used here as D5 (confirmed in the official one).
# --- CAMERA (disabled on purpose) -------------------------------------------
# No use as a motion sensor: the board has no infrared LED (at
# night it sees nothing) and ESPHome does not do image motion detection.
# Keeping this cost 12 KB of RAM, 65 KB of flash and ~1.2 MB of PSRAM.
# To put it back: remove the '#' from this block.
# esp32_camera:
#   id: lcd_camera
#   name: "Câmara"
#   icon: "mdi:camera"
#   external_clock:
#     pin: GPIO41
#     frequency: 20MHz
#   i2c_id: bus_a
#   data_pins:
#     - GPIO12
#     - GPIO4
#     - GPIO11
#     - GPIO17
#     - GPIO18
#     - GPIO3
#     - GPIO1
#     - GPIO2
#   vsync_pin: GPIO39
#   href_pin: GPIO40
#   pixel_clock_pin: GPIO38
#   resolution: 640x480
#   jpeg_quality: 10
#   max_framerate: 10fps
#   idle_framerate: 0.1fps
#   frame_buffer_count: 2
#   frame_buffer_location: PSRAM
#   # This sensor (GC0308) is very weak in low light — push gain/exposure
#   brightness: 2
#   contrast: 0
#   aec2: true
#   ae_level: 2
#   agc_gain_ceiling: 32X
#
